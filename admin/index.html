<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeBetAI - Social Intelligence | Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        teal: { DEFAULT: '#006B6E', light: '#E0F5F5', mint: '#E8FAF8' },
        charcoal: { DEFAULT: '#1A1A2E', dark: '#0D0D1A' },
        txt: { primary: '#1A1A1A', secondary: '#6B7280' },
        success: '#10B981',
        danger: '#EF4444',
        border: '#E5E7EB',
      },
      fontFamily: { inter: ['Inter', 'sans-serif'] },
    }
  }
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #F9FAFB; color: #1A1A1A; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }

/* Login styles */
.login-input { background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 12px 0; width: 100%; font-size: 15px; outline: none; transition: border-color 0.2s; }
.login-input:focus { border-bottom-color: #fff; }
.login-input::placeholder { color: rgba(255,255,255,0.4); }

/* Sidebar */
.sidebar { width: 220px; min-height: 100vh; background: #006B6E; position: fixed; left: 0; top: 0; z-index: 40; transition: width 0.2s; }
.sidebar-link { display: flex; align-items: center; gap: 12px; padding: 11px 20px; color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 500; border-radius: 8px; margin: 2px 10px; transition: all 0.15s; cursor: pointer; text-decoration: none; }
.sidebar-link:hover { background: rgba(255,255,255,0.1); color: #fff; }
.sidebar-link.active { background: rgba(255,255,255,0.18); color: #fff; }
.sidebar-link svg { width: 20px; height: 20px; flex-shrink: 0; }

/* Content area */
.main-content { margin-left: 220px; min-height: 100vh; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; border-radius: 24px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; border: 1.5px solid transparent; white-space: nowrap; }
.pill-teal { background: #006B6E; color: #fff; border-color: #006B6E; }
.pill-teal:hover { background: #005557; }
.pill-outlined { background: transparent; color: #006B6E; border-color: #006B6E; }
.pill-outlined:hover { background: #E0F5F5; }
.pill-danger { background: #EF4444; color: #fff; border-color: #EF4444; }
.pill-danger:hover { background: #DC2626; }
.pill-success { background: #10B981; color: #fff; border-color: #10B981; }

/* Status pills */
.status-ready { background: #D1FAE5; color: #065F46; }
.status-posted-x { background: #DBEAFE; color: #1E40AF; }
.status-posted-truth { background: #FEE2E2; color: #991B1B; }
.status-posted-both { background: #EDE9FE; color: #5B21B6; }
.status-scheduled { background: #FEF3C7; color: #92400E; }
.status-queued { background: #F3F4F6; color: #374151; }

/* Card */
.card { background: #fff; border: 1px solid #E5E7EB; border-radius: 12px; padding: 24px; margin-bottom: 16px; }

/* Modal overlay */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center; }
.modal-box { background: #fff; border-radius: 16px; padding: 32px; max-width: 440px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }

/* Toast */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 14px 20px; border-radius: 10px; color: #fff; font-size: 14px; font-weight: 500; box-shadow: 0 4px 20px rgba(0,0,0,0.15); animation: slideIn 0.3s ease; max-width: 380px; }
.toast-success { background: #10B981; }
.toast-error { background: #EF4444; }
.toast-info { background: #006B6E; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

/* Skeleton */
.skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Category filter */
.cat-pill { padding: 8px 18px; border-radius: 24px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; border: 1.5px solid #006B6E; }
.cat-pill.active { background: #006B6E; color: #fff; }
.cat-pill:not(.active) { background: transparent; color: #006B6E; }
.cat-pill:not(.active):hover { background: #E0F5F5; }

/* Table */
.admin-table { width: 100%; border-collapse: separate; border-spacing: 0; }
.admin-table th { text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #E5E7EB; }
.admin-table td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #F3F4F6; vertical-align: middle; }
.admin-table tr:hover td { background: #F9FAFB; }

/* Checkbox */
.teal-checkbox { accent-color: #006B6E; width: 16px; height: 16px; cursor: pointer; }

/* Textarea */
.compose-textarea { width: 100%; min-height: 120px; border: 1px solid #E5E7EB; border-radius: 8px; padding: 12px; font-size: 14px; font-family: 'Inter', sans-serif; resize: vertical; outline: none; transition: border-color 0.15s; }
.compose-textarea:focus { border-color: #006B6E; box-shadow: 0 0 0 3px rgba(0,107,110,0.1); }

/* NEW badge */
.new-badge { background: #006B6E; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.05em; }

/* Mobile */
@media (max-width: 768px) {
  .sidebar { width: 60px; }
  .sidebar .sidebar-text { display: none; }
  .sidebar .sidebar-logo-text { display: none; }
  .sidebar-link { justify-content: center; padding: 11px; margin: 2px 6px; }
  .main-content { margin-left: 60px; }
}
</style>
</head>

<div id="app"></div>
<div id="toast-container" class="toast-container"></div>
<div id="modal-root"></div>

<script>
// ─── State ───────────────────────────────────────────────────────────
const APP = {
  token: localStorage.getItem('admin_token'),
  userEmail: localStorage.getItem('admin_email') || 'ben@webetsocial.com',
  currentPage: 'feed',
  feedItems: [],
  feedCategory: 'trending',
  feedLoading: false,
  lastRefreshed: null,
  queueItems: [],
  queuePage: 1,
  queueTotal: 0,
  queueSearch: '',
  queueSelected: new Set(),
  historyItems: [],
  historyPage: 1,
  historyTotal: 0,
  historyFilters: { platform: '', dateFrom: '', dateTo: '', category: '', search: '' },
  historySelected: new Set(),
  settings: {},
  rateLimits: { x: { remaining: 48, total: 50 }, truth: { remaining: 25, total: 25 } },
};

const CATEGORIES = ['Trending', 'Politics', 'Sports', 'Crypto', 'Entertainment', 'Tech', 'Markets', 'Culture'];

// ─── Toast ───────────────────────────────────────────────────────────
function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => { toast.style.animation = 'fadeOut 0.3s ease forwards'; setTimeout(() => toast.remove(), 300); }, 3500);
}

// ─── Modal ───────────────────────────────────────────────────────────
function showModal(title, message, onConfirm, confirmText = 'Confirm', confirmClass = 'pill-teal') {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-box">
        <h3 class="text-lg font-bold text-txt-primary mb-2">${title}</h3>
        <p class="text-sm text-txt-secondary mb-6">${message}</p>
        <div class="flex gap-3 justify-end">
          <button class="pill pill-outlined" onclick="closeModal()">Cancel</button>
          <button class="pill ${confirmClass}" id="modal-confirm-btn">${confirmText}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modal-confirm-btn').addEventListener('click', () => { closeModal(); onConfirm(); });
}

function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

// ─── API ─────────────────────────────────────────────────────────────
async function api(path, options = {}) {
  try {
    const res = await fetch(path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${APP.token}`,
        ...(options.headers || {})
      },
      body: options.body ? (typeof options.body === 'string' ? options.body : JSON.stringify(options.body)) : undefined
    });
    if (res.status === 401) { logout(); throw new Error('Unauthorized'); }
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.error || `Request failed (${res.status})`); }
    return res.json();
  } catch (err) {
    if (err.message !== 'Unauthorized') showToast(err.message, 'error');
    throw err;
  }
}

// ─── Auth ────────────────────────────────────────────────────────────
async function handleLogin(email, password) {
  try {
    const data = await api('/api/admin/auth', { method: 'POST', body: JSON.stringify({ email, password }) });
    APP.token = data.token;
    APP.userEmail = email;
    localStorage.setItem('admin_token', data.token);
    localStorage.setItem('admin_email', email);
    location.hash = '#feed';
  } catch (e) {
    showToast('Login failed. Check your credentials.', 'error');
  }
}

function logout() {
  APP.token = null;
  localStorage.removeItem('admin_token');
  localStorage.removeItem('admin_email');
  location.hash = '#login';
}

// ─── Router ──────────────────────────────────────────────────────────
function router() {
  const hash = location.hash.slice(1) || (APP.token ? 'feed' : 'login');
  if (!APP.token && hash !== 'login') { location.hash = '#login'; return; }
  if (APP.token && hash === 'login') { location.hash = '#feed'; return; }
  APP.currentPage = hash;
  renderPage(hash);
}

function renderPage(page) {
  const app = document.getElementById('app');
  if (page === 'login') {
    app.innerHTML = renderLogin();
    bindLoginEvents();
  } else {
    app.innerHTML = renderShell(page);
    bindShellEvents(page);
    loadPageData(page);
  }
}

// ─── Login Page ──────────────────────────────────────────────────────
function renderLogin() {

        <form id="login-form">
          <label class="block text-xs font-semibold text-white/60 tracking-widest uppercase mb-2">Email ID</label>

          <label class="block text-xs font-semibold text-white/60 tracking-widest uppercase mb-2">Password</label>
          <div class="relative mb-6">
            <input type="password" id="login-password" class="login-input pr-10" placeholder="Enter password" required>
            <button type="button" id="toggle-password" class="absolute right-0 top-1/2 -translate-y-1/2 text-white/40 hover:text-white/80 w-5 h-5">${ICONS.eye}</button>
          </div>
          <label class="flex items-center gap-2 mb-8 cursor-pointer">
            <input type="checkbox" class="teal-checkbox" checked>
            <span class="text-sm text-white/60">Remember me</span>
          </label>
          <button type="submit" class="w-full py-3 rounded-3xl bg-white text-charcoal-dark font-bold text-sm hover:bg-gray-100 transition">LOGIN</button>
        </form>
      </div>
    </div>
  </div>`;
}

function bindLoginEvents() {
  const form = document.getElementById('login-form');
  form?.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    handleLogin(email, password);
  });
  const toggle = document.getElementById('toggle-password');
  toggle?.addEventListener('click', () => {
    const input = document.getElementById('login-password');
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    toggle.innerHTML = isPassword ? ICONS.eyeOff : ICONS.eye;
  });
}

// ─── App Shell ───────────────────────────────────────────────────────
function renderShell(page) {
  const navItems = [
    { id: 'feed', label: 'Feed', icon: 'feed' },
    { id: 'queue', label: 'Queue', icon: 'queue' },
    { id: 'history', label: 'History', icon: 'history' },
    { id: 'compose', label: 'Compose', icon: 'compose' },
    { id: 'settings', label: 'Settings', icon: 'settings' },
  ];
  const pageTitle = { feed: 'Feed', queue: 'Post Queue', history: 'Published History', compose: 'Compose Post', settings: 'Settings' }[page] || 'Feed';
  const initial = (APP.userEmail || 'B')[0].toUpperCase();

  return `
  <!-- Sidebar -->
  <aside class="sidebar flex flex-col">
    <div class="flex items-center gap-2 px-5 py-5 mb-4">
      <span class="w-8 h-8 text-white flex-shrink-0">${ICONS.dice}</span>
      <span class="sidebar-logo-text text-white font-extrabold text-lg">WeBet</span>
    </div>
    <nav class="flex-1">
      ${navItems.map(n => `
        <a href="#${n.id}" class="sidebar-link ${page === n.id ? 'active' : ''}">
          ${icon(n.icon, 'w-5 h-5')}
          <span class="sidebar-text">${n.label}</span>
        </a>
      `).join('')}
    </nav>
    <div class="px-3 pb-5">
      <button onclick="logout()" class="sidebar-link w-full">
        ${icon('logout', 'w-5 h-5')}
        <span class="sidebar-text">Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-content">
    <!-- Top Bar -->
    <header class="bg-white border-b border-border px-6 py-3 flex items-center justify-between sticky top-0 z-30">
      <h1 class="text-lg font-bold text-txt-primary">${pageTitle}</h1>
      <div class="flex items-center gap-4">
        <div class="hidden sm:flex items-center gap-3 text-xs text-txt-secondary">
          <span class="flex items-center gap-1">${icon('x','w-3.5 h-3.5')} <span class="font-semibold text-txt-primary">${APP.rateLimits.x.remaining}</span>/${APP.rateLimits.x.total}</span>
          <span class="text-border">|</span>
          <span class="flex items-center gap-1">TS <span class="font-semibold text-txt-primary">${APP.rateLimits.truth.remaining}</span>/${APP.rateLimits.truth.total}</span>
        </div>
        <div class="flex items-center gap-2 cursor-pointer">
          <div class="w-8 h-8 rounded-full bg-teal flex items-center justify-center text-white text-sm font-bold">${initial}</div>
          <span class="hidden sm:inline text-sm text-txt-secondary">${APP.userEmail}</span>
          <span class="w-4 h-4 text-txt-secondary">${ICONS.chevDown}</span>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="p-6" id="page-content">
      ${renderPageContent(page)}
    </main>
  </div>`;
}

function renderPageContent(page) {
  switch (page) {
    case 'feed': return renderFeedPage();
    case 'queue': return renderQueuePage();
    case 'history': return renderHistoryPage();
    case 'compose': return renderComposePage();
    case 'settings': return renderSettingsPage();
    default: return renderFeedPage();
  }
}

function bindShellEvents(page) {
  switch (page) {
    case 'feed': bindFeedEvents(); break;
    case 'queue': bindQueueEvents(); break;
    case 'history': bindHistoryEvents(); break;
    case 'compose': bindComposeEvents(); break;
    case 'settings': bindSettingsEvents(); break;
  }
}

async function loadPageData(page) {
  switch (page) {
    case 'feed': await loadFeed(); break;
    case 'queue': await loadQueue(); break;
    case 'history': await loadHistory(); break;
    case 'settings': await loadSettings(); break;
  }
}

// ─── Feed Page ───────────────────────────────────────────────────────
function renderFeedPage() {
  const lastRefresh = APP.lastRefreshed ? `Last refreshed: ${APP.lastRefreshed.toLocaleTimeString()}` : '';
  return `
    <div class="flex flex-wrap items-center gap-3 mb-6">
      <div class="flex flex-wrap gap-2 flex-1">
        ${CATEGORIES.map(c => `<button class="cat-pill ${APP.feedCategory === c.toLowerCase() ? 'active' : ''}" data-cat="${c.toLowerCase()}">${c}</button>`).join('')}
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-txt-secondary">${lastRefresh}</span>
        <button class="pill pill-outlined flex items-center gap-2" id="refresh-feed-btn">${icon('refresh','w-4 h-4')} Refresh Feed</button>
      </div>
    </div>
    <div id="feed-list">
      ${APP.feedLoading ? renderSkeletonCards(3) : renderFeedItems()}
    </div>`;
}

function renderSkeletonCards(n) {
  return Array(n).fill(0).map(() => `
    <div class="card">
      <div class="skeleton h-4 w-1/3 mb-4"></div>
      <div class="skeleton h-3 w-full mb-2"></div>
      <div class="skeleton h-3 w-2/3 mb-6"></div>
      <div class="flex gap-4">
        <div class="skeleton h-24 flex-1"></div>
        <div class="skeleton h-24 flex-1"></div>
      </div>
      <div class="flex gap-2 mt-4">
        <div class="skeleton h-8 w-24"></div>
        <div class="skeleton h-8 w-24"></div>
        <div class="skeleton h-8 w-24"></div>
      </div>
    </div>`).join('');
}

function renderFeedItems() {
  if (!APP.feedItems.length) return '<div class="text-center py-16 text-txt-secondary"><p class="text-lg font-medium">No feed items</p><p class="text-sm mt-1">Try refreshing or switching categories.</p></div>';
  return APP.feedItems.map((item, i) => renderFeedCard(item, i)).join('');
}

function renderFeedCard(item, idx) {
  const statusCls = {
    'ready': 'status-ready', 'posted_x': 'status-posted-x', 'posted_truth': 'status-posted-truth',
    'posted_both': 'status-posted-both', 'scheduled': 'status-scheduled', 'queued': 'status-queued'
  }[item.status || 'ready'] || 'status-ready';
  const statusLabel = {
    'ready': 'Ready', 'posted_x': 'Posted to X', 'posted_truth': 'Posted to Truth',
    'posted_both': 'Posted to Both', 'scheduled': 'Scheduled', 'queued': 'Queued'
  }[item.status || 'ready'] || 'Ready';

  const xLen = (item.x_text || '').length;
  const tsLen = (item.truth_text || '').length;

  return `
  <div class="card" data-feed-idx="${idx}">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-2">
        ${item.isNew ? '<span class="new-badge">NEW</span>' : ''}
        <span class="text-xs font-semibold px-2 py-0.5 rounded-full" style="background:#E0F5F5;color:#006B6E">${item.category || 'Trending'}</span>
      </div>
      <span class="text-xs font-semibold px-3 py-1 rounded-full ${statusCls}">${statusLabel}</span>
    </div>

    <!-- Source Preview -->
    <div class="bg-gray-50 rounded-lg p-4 mb-4">
      <div class="flex items-start gap-3 mb-3">
        <div class="w-10 h-10 rounded-full bg-teal/10 flex items-center justify-center text-teal font-bold text-sm flex-shrink-0">${(item.source?.name || 'U')[0]}</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-semibold text-sm text-txt-primary">${item.source?.name || 'Unknown'}</span>
            <span class="text-xs text-txt-secondary">@${item.source?.handle || 'unknown'}</span>
          </div>
          <p class="text-sm text-txt-primary mt-1">${item.source?.text || ''}</p>
          <div class="flex items-center gap-4 mt-2 text-xs text-txt-secondary">
            <span class="flex items-center gap-1">${icon('heart','w-3.5 h-3.5')} ${formatNum(item.source?.likes || 0)}</span>
            <span class="flex items-center gap-1">${icon('retweet','w-3.5 h-3.5')} ${formatNum(item.source?.retweets || 0)}</span>
            ${item.source?.url ? `<a href="${item.source.url}" target="_blank" class="text-teal hover:underline">View on X ${ICONS.externalLink}</a>` : ''}
          </div>
        </div>
      </div>
      ${item.market ? `
      <div class="mt-3 p-3 border border-border rounded-lg bg-white">
        <p class="text-sm font-semibold text-txt-primary mb-2">${item.market.question || ''}</p>
        <div class="flex flex-wrap items-center gap-3 text-xs">
          <span class="px-3 py-1 rounded-full bg-green-100 text-green-700 font-bold">YES ${item.market.yes_odds || '—'}%</span>
          <span class="px-3 py-1 rounded-full bg-red-100 text-red-700 font-bold">NO ${item.market.no_odds || '—'}%</span>
          <span class="text-txt-secondary">Vol: $${formatNum(item.market.volume || 0)}</span>
          <span class="text-txt-secondary">Bettability: <strong class="text-teal">${item.market.bettability || '—'}/10</strong></span>
        </div>
        ${item.market.grok_reason ? `<p class="text-xs text-txt-secondary mt-2 italic">${item.market.grok_reason}</p>` : ''}
      </div>` : ''}
    </div>

    <!-- AI-Composed Posts -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs font-semibold text-txt-secondary uppercase tracking-wide">X Version</label>
          <span class="text-xs ${xLen > 280 ? 'text-danger font-bold' : 'text-txt-secondary'}" id="x-counter-${idx}">${xLen}/280</span>
        </div>
        <textarea class="compose-textarea" data-idx="${idx}" data-platform="x" maxlength="280" rows="4">${item.x_text || ''}</textarea>
      </div>
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs font-semibold text-txt-secondary uppercase tracking-wide">Truth Social Version</label>
          <span class="text-xs ${tsLen > 500 ? 'text-danger font-bold' : 'text-txt-secondary'}" id="ts-counter-${idx}">${tsLen}/500</span>
        </div>
        <textarea class="compose-textarea" data-idx="${idx}" data-platform="truth" maxlength="500" rows="4">${item.truth_text || ''}</textarea>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-wrap gap-2">
      <button class="pill pill-teal" onclick="publishAction(${idx},'x')">${icon('x','w-4 h-4')} Post to X</button>
      <button class="pill pill-teal" onclick="publishAction(${idx},'truth')">Post to Truth</button>
      <button class="pill pill-teal text-sm px-6" onclick="publishAction(${idx},'both')">Post to Both</button>
      <button class="pill pill-outlined" onclick="scheduleAction(${idx})">${icon('calendar','w-4 h-4')} Schedule</button>
      <button class="pill pill-outlined" onclick="queueAction(${idx})">Add to Queue</button>
      <button class="pill pill-danger" onclick="dismissAction(${idx})">Dismiss</button>
      <button class="pill pill-outlined" onclick="regenerateAction(${idx})">${icon('refresh','w-4 h-4')} Regenerate</button>
    </div>
  </div>`;
}

function bindFeedEvents() {
  document.querySelectorAll('.cat-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      APP.feedCategory = btn.dataset.cat;
      renderAndBindPage('feed');
      loadFeed();
    });
  });
  document.getElementById('refresh-feed-btn')?.addEventListener('click', () => loadFeed());
  bindTextareaCounters();
}

function bindTextareaCounters() {
  document.querySelectorAll('.compose-textarea').forEach(ta => {
    ta.addEventListener('input', () => {
      const idx = ta.dataset.idx;
      const platform = ta.dataset.platform;
      const max = platform === 'x' ? 280 : 500;
      const len = ta.value.length;
      const counter = document.getElementById(`${platform === 'x' ? 'x' : 'ts'}-counter-${idx}`);
      if (counter) {
        counter.textContent = `${len}/${max}`;
        counter.className = `text-xs ${len > max ? 'text-danger font-bold' : 'text-txt-secondary'}`;
      }
      if (APP.feedItems[idx]) {
        if (platform === 'x') APP.feedItems[idx].x_text = ta.value;
        else APP.feedItems[idx].truth_text = ta.value;
      }
    });
  });
}

async function loadFeed() {
  APP.feedLoading = true;
  updateFeedList();
  try {
    const data = await api(`/api/admin/feed?category=${APP.feedCategory}&limit=5`);
    APP.feedItems = (data.items || []).map((item, i) => ({ ...item, isNew: i < 2 }));
    APP.lastRefreshed = new Date();
  } catch (e) {
    APP.feedItems = getDemoFeedItems();
    APP.lastRefreshed = new Date();
  }
  APP.feedLoading = false;
  updateFeedList();
  bindTextareaCounters();
}

function updateFeedList() {
  const el = document.getElementById('feed-list');
  if (el) {
    el.innerHTML = APP.feedLoading ? renderSkeletonCards(3) : renderFeedItems();
    if (!APP.feedLoading) bindTextareaCounters();
  }
}

function publishAction(idx, target) {
  const labels = { x: 'X', truth: 'Truth Social', both: 'X and Truth Social' };
  showModal('Confirm Publish', `Are you sure you want to post this to ${labels[target]}?`, async () => {
    try {
      await api('/api/admin/publish', { method: 'POST', body: { id: APP.feedItems[idx]?.id, target, x_text: APP.feedItems[idx]?.x_text, truth_text: APP.feedItems[idx]?.truth_text } });
      showToast(`Posted to ${labels[target]} successfully!`, 'success');
      APP.feedItems[idx].status = target === 'both' ? 'posted_both' : `posted_${target}`;
      updateFeedList();
    } catch (e) { /* toast already shown */ }
  }, 'Publish', 'pill-teal');
}

function scheduleAction(idx) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-box">
        <h3 class="text-lg font-bold text-txt-primary mb-4">Schedule Post</h3>
        <label class="block text-sm font-medium text-txt-secondary mb-2">Date & Time</label>
        <input type="datetime-local" id="schedule-datetime" class="w-full border border-border rounded-lg px-3 py-2 text-sm mb-4">
        <label class="block text-sm font-medium text-txt-secondary mb-2">Platform</label>
        <select id="schedule-platform" class="w-full border border-border rounded-lg px-3 py-2 text-sm mb-6">
          <option value="both">Both (X + Truth)</option>
          <option value="x">X only</option>
          <option value="truth">Truth Social only</option>
        </select>
        <div class="flex gap-3 justify-end">
          <button class="pill pill-outlined" onclick="closeModal()">Cancel</button>
          <button class="pill pill-teal" id="schedule-confirm">Schedule</button>
        </div>
      </div>
    </div>`;
  document.getElementById('schedule-confirm').addEventListener('click', async () => {
    const dt = document.getElementById('schedule-datetime').value;
    const platform = document.getElementById('schedule-platform').value;
    if (!dt) { showToast('Please select a date and time', 'error'); return; }
    closeModal();
    try {
      await api('/api/admin/schedule', { method: 'POST', body: { id: APP.feedItems[idx]?.id, scheduled_at: dt, platform, x_text: APP.feedItems[idx]?.x_text, truth_text: APP.feedItems[idx]?.truth_text } });
      showToast('Post scheduled successfully!', 'success');
      APP.feedItems[idx].status = 'scheduled';
      updateFeedList();
    } catch (e) { /* toast already shown */ }
  });
}

function queueAction(idx) {
  showModal('Add to Queue', 'This post will be added to the publishing queue for review.', async () => {
    try {
      await api('/api/admin/queue', { method: 'POST', body: { id: APP.feedItems[idx]?.id, x_text: APP.feedItems[idx]?.x_text, truth_text: APP.feedItems[idx]?.truth_text } });
      showToast('Added to queue!', 'success');
      APP.feedItems[idx].status = 'queued';
      updateFeedList();
    } catch (e) { /* toast already shown */ }
  }, 'Add to Queue', 'pill-teal');
}

function dismissAction(idx) {
  showModal('Dismiss Post', 'This post will be dismissed and removed from the feed.', async () => {
    try {
      await api('/api/admin/dismiss', { method: 'POST', body: { id: APP.feedItems[idx]?.id } });
      APP.feedItems.splice(idx, 1);
      showToast('Post dismissed', 'info');
      updateFeedList();
    } catch (e) { /* toast already shown */ }
  }, 'Dismiss', 'pill-danger');
}

async function regenerateAction(idx) {
  try {
    showToast('Regenerating post...', 'info');
    const data = await api('/api/admin/regenerate', { method: 'POST', body: { id: APP.feedItems[idx]?.id } });
    if (data.x_text) APP.feedItems[idx].x_text = data.x_text;
    if (data.truth_text) APP.feedItems[idx].truth_text = data.truth_text;
    updateFeedList();
    showToast('Post regenerated!', 'success');
  } catch (e) { /* toast already shown */ }
}

// ─── Queue Page ──────────────────────────────────────────────────────
function renderQueuePage() {
  const items = APP.queueItems;
  const needsReview = items.filter(i => i.status === 'needs_review');
  const others = items.filter(i => i.status !== 'needs_review');
  const hasSelected = APP.queueSelected.size > 0;
  const perPage = 10;
  const total = APP.queueTotal || items.length;
  const start = (APP.queuePage - 1) * perPage + 1;
  const end = Math.min(APP.queuePage * perPage, total);

  return `
    <div class="flex flex-wrap items-center gap-3 mb-6">
      <div class="relative flex-1 max-w-xs">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-txt-secondary">${ICONS.search}</span>
        <input type="text" id="queue-search" class="w-full pl-10 pr-4 py-2 border border-border rounded-full text-sm" placeholder="Search queue..." value="${APP.queueSearch}">
      </div>
      <button class="pill pill-teal" onclick="location.hash='#compose'">${icon('plus','w-4 h-4')} Add Post</button>
    </div>

    ${hasSelected ? `
    <div class="flex items-center gap-3 mb-4 p-3 bg-teal-light rounded-lg">
      <span class="text-sm font-medium text-teal">${APP.queueSelected.size} selected</span>
      <button class="pill pill-success text-xs" onclick="bulkQueueAction('approve')">Approve All</button>
      <button class="pill pill-danger text-xs" onclick="bulkQueueAction('dismiss')">Dismiss All</button>
    </div>` : ''}

    ${needsReview.length ? `
    <div class="mb-6">
      <h3 class="text-sm font-semibold text-amber-700 mb-3">Needs Review (${needsReview.length})</h3>
      <div class="border-l-4 border-amber-400 bg-amber-50 rounded-r-lg overflow-hidden">
        <table class="admin-table">
          <thead><tr><th class="w-10"></th><th>Preview</th><th>Platform</th><th>Scheduled</th><th>Status</th><th class="w-20">Actions</th></tr></thead>
          <tbody>${needsReview.map((item, i) => renderQueueRow(item, i, true)).join('')}</tbody>
        </table>
      </div>
    </div>` : ''}

    <div class="card p-0 overflow-hidden">
      <table class="admin-table">
        <thead><tr><th class="w-10"><input type="checkbox" class="teal-checkbox" id="queue-select-all"></th><th>Preview</th><th>Platform</th><th>Scheduled</th><th>Status</th><th class="w-20">Actions</th></tr></thead>
        <tbody id="queue-tbody">
          ${others.length ? others.map((item, i) => renderQueueRow(item, i)).join('') : '<tr><td colspan="6" class="text-center py-8 text-txt-secondary">No queued posts</td></tr>'}
        </tbody>
      </table>
    </div>

    <div class="flex items-center justify-end gap-4 mt-4 text-sm text-txt-secondary">
      <span>${start}-${end} of ${total}</span>
      <div class="flex gap-1">
        <button class="px-3 py-1 border border-border rounded hover:bg-gray-50 ${APP.queuePage <= 1 ? 'opacity-40 pointer-events-none' : ''}" onclick="APP.queuePage--;loadQueue()">&#8592;</button>
        <button class="px-3 py-1 border border-border rounded hover:bg-gray-50 ${end >= total ? 'opacity-40 pointer-events-none' : ''}" onclick="APP.queuePage++;loadQueue()">&#8594;</button>
      </div>
    </div>`;
}

function renderQueueRow(item, idx, isReview = false) {
  const checked = APP.queueSelected.has(item.id) ? 'checked' : '';
  const platformPills = (item.platforms || ['x']).map(p => {
    if (p === 'x') return '<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-gray-900 text-white">X</span>';
    return '<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-red-600 text-white">TS</span>';
  }).join(' ');
  const statusCls = { approved: 'status-ready', needs_review: 'status-scheduled', scheduled: 'status-scheduled', dismissed: 'status-queued' }[item.status] || 'status-queued';
  const statusLabel = { approved: 'Approved', needs_review: 'Needs Review', scheduled: 'Scheduled', dismissed: 'Dismissed' }[item.status] || item.status;
  const preview = (item.x_text || item.text || '').slice(0, 80) + ((item.x_text || item.text || '').length > 80 ? '...' : '');

  return `<tr>
    <td><input type="checkbox" class="teal-checkbox queue-item-cb" data-id="${item.id}" ${checked}></td>
    <td class="max-w-xs"><span class="text-sm">${preview}</span></td>
    <td>${platformPills}</td>
    <td class="text-sm text-txt-secondary">${item.scheduled_at ? new Date(item.scheduled_at).toLocaleString() : '—'}</td>
    <td><span class="text-xs font-semibold px-2 py-1 rounded-full ${statusCls}">${statusLabel}</span></td>
    <td>
      <div class="flex items-center gap-2">
        <button class="w-7 h-7 flex items-center justify-center rounded hover:bg-gray-100 text-txt-secondary" onclick="editQueueItem('${item.id}')">${icon('edit','w-4 h-4')}</button>
        <button class="w-7 h-7 flex items-center justify-center rounded hover:bg-red-50 text-danger" onclick="deleteQueueItem('${item.id}')">${icon('trash','w-4 h-4')}</button>
      </div>
    </td>
  </tr>`;
}

function bindQueueEvents() {
  document.getElementById('queue-search')?.addEventListener('input', debounce((e) => {
    APP.queueSearch = e.target.value;
    APP.queuePage = 1;
    loadQueue();
  }, 300));
  document.getElementById('queue-select-all')?.addEventListener('change', (e) => {
    const cbs = document.querySelectorAll('.queue-item-cb');
    cbs.forEach(cb => {
      cb.checked = e.target.checked;
      if (e.target.checked) APP.queueSelected.add(cb.dataset.id);
      else APP.queueSelected.delete(cb.dataset.id);
    });
    renderAndBindPage('queue');
  });
  document.querySelectorAll('.queue-item-cb').forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) APP.queueSelected.add(cb.dataset.id);
      else APP.queueSelected.delete(cb.dataset.id);
      renderAndBindPage('queue');
    });
  });
}

async function loadQueue() {
  try {
    const data = await api(`/api/admin/queue?page=${APP.queuePage}&search=${encodeURIComponent(APP.queueSearch)}`);
    APP.queueItems = data.items || [];
    APP.queueTotal = data.total || APP.queueItems.length;
  } catch (e) {
    APP.queueItems = getDemoQueueItems();
    APP.queueTotal = APP.queueItems.length;
  }
  const el = document.getElementById('page-content');
  if (el && APP.currentPage === 'queue') { el.innerHTML = renderQueuePage(); bindQueueEvents(); }
}

async function bulkQueueAction(action) {
  const ids = Array.from(APP.queueSelected);
  showModal(`${action === 'approve' ? 'Approve' : 'Dismiss'} ${ids.length} posts`, `Are you sure you want to ${action} ${ids.length} selected posts?`, async () => {
    try {
      await api(`/api/admin/queue/bulk`, { method: 'POST', body: { ids, action } });
      showToast(`${ids.length} posts ${action}d`, 'success');
      APP.queueSelected.clear();
      loadQueue();
    } catch (e) { /* toast already shown */ }
  }, action === 'approve' ? 'Approve All' : 'Dismiss All', action === 'approve' ? 'pill-success' : 'pill-danger');
}

function editQueueItem(id) { location.hash = '#compose'; }
function deleteQueueItem(id) {
  showModal('Delete Post', 'Are you sure you want to remove this post from the queue?', async () => {
    try {
      await api(`/api/admin/queue/${id}`, { method: 'DELETE' });
      showToast('Post removed from queue', 'info');
      loadQueue();
    } catch (e) { /* toast already shown */ }
  }, 'Delete', 'pill-danger');
}

// ─── History Page ────────────────────────────────────────────────────
function renderHistoryPage() {
  const items = APP.historyItems;
  const total = APP.historyTotal || items.length;
  const perPage = 10;
  const start = (APP.historyPage - 1) * perPage + 1;
  const end = Math.min(APP.historyPage * perPage, total);

  // Stats
  const totalPosts = total;
  const xPosts = items.filter(i => (i.platforms || []).includes('x')).length;

      <div class="relative flex-1 min-w-[200px]">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-txt-secondary">${ICONS.search}</span>

function renderHistoryRow(item, idx) {

  const preview = (item.text || '').slice(0, 80) + ((item.text || '').length > 80 ? '...' : '');
  const eng = item.engagement || {};

  return `<tr class="cursor-pointer" onclick="showHistoryPreview(${idx})">

      </div>
    </td>

      <button class="w-7 h-7 flex items-center justify-center rounded hover:bg-gray-100 text-txt-secondary" onclick="showHistoryPreview(${idx})">${icon('eye','w-4 h-4')}</button>

}

function showHistoryPreview(idx) {

function bindHistoryEvents() {
  ['hist-platform', 'hist-date-from', 'hist-date-to', 'hist-category'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', () => { APP.historyPage = 1; loadHistory(); });
  });
  document.getElementById('hist-search')?.addEventListener('input', debounce(() => { APP.historyPage = 1; loadHistory(); }, 300));
}

async function loadHistory() {
  const f = APP.historyFilters;
  const platform = document.getElementById('hist-platform')?.value || f.platform;
  const dateFrom = document.getElementById('hist-date-from')?.value || f.dateFrom;
  const dateTo = document.getElementById('hist-date-to')?.value || f.dateTo;
  const category = document.getElementById('hist-category')?.value || f.category;
  const search = document.getElementById('hist-search')?.value || f.search;
  APP.historyFilters = { platform, dateFrom, dateTo, category, search };

  try {
    const params = new URLSearchParams({ page: APP.historyPage, platform, dateFrom, dateTo, category, search });
    const data = await api(`/api/admin/history?${params}`);
    APP.historyItems = data.items || [];
    APP.historyTotal = data.total || APP.historyItems.length;
  } catch (e) {
    APP.historyItems = getDemoHistoryItems();
    APP.historyTotal = APP.historyItems.length;
  }
  const el = document.getElementById('page-content');
  if (el && APP.currentPage === 'history') { el.innerHTML = renderHistoryPage(); bindHistoryEvents(); }
}

async function generateCompose(type) {
  const source = document.getElementById('compose-source')?.value || '';
  showToast('Generating with Betty...', 'info');
  try {
    const data = await api('/api/admin/compose-post', { method: 'POST', body: { type, source } });

    document.getElementById('compose-ts').value = data.truth_text || '';
    document.getElementById('compose-output').classList.remove('hidden');
    document.getElementById('compose-x').dispatchEvent(new Event('input'));
    document.getElementById('compose-ts').dispatchEvent(new Event('input'));
    showToast('Post generated!', 'success');
  } catch (e) {
    // Demo fallback
    document.getElementById('compose-x').value = 'Breaking: Markets are moving. The smart money is on the over. #WeBetAI';

function bindSettingsEvents() {
  // Toggle switch
  const toggle = document.getElementById('set-autodraft-enabled');
  const track = document.getElementById('autodraft-track');
  const thumb = document.getElementById('autodraft-thumb');
  if (toggle && track && thumb) {
    const update = () => {
      if (toggle.checked) { track.style.background = '#006B6E'; thumb.style.transform = 'translateX(20px)'; }
      else { track.style.background = '#D1D5DB'; thumb.style.transform = 'translateX(0)'; }
    };
    update();
    track.addEventListener('click', () => { toggle.checked = !toggle.checked; update(); });
    thumb.addEventListener('click', () => { toggle.checked = !toggle.checked; update(); });
  }
}

async function saveSettings(section) {
  let body = { section };
  switch (section) {
    case 'api_keys':
      body.xai_key = document.getElementById('set-xai-key')?.value;
      body.x_token = document.getElementById('set-x-token')?.value;
      body.x_api_key = document.getElementById('set-x-api-key')?.value;
      body.x_api_secret = document.getElementById('set-x-api-secret')?.value;
      body.truth_token = document.getElementById('set-truth-token')?.value;
      break;
    case 'betty':
      body.betty_prompt = document.getElementById('set-betty-prompt')?.value;
      break;
    case 'feed':
      body.categories = Array.from(document.querySelectorAll('.set-category-cb:checked')).map(cb => cb.value);
      body.refresh_interval = parseInt(document.getElementById('set-refresh-interval')?.value);
      body.items_per_category = parseInt(document.getElementById('set-items-per-cat')?.value);
      break;
    case 'queue':
      body.posts_per_day = parseInt(document.getElementById('set-posts-per-day')?.value);
      body.min_spacing = parseFloat(document.getElementById('set-min-spacing')?.value);
      body.quiet_start = document.getElementById('set-quiet-start')?.value;
      body.quiet_end = document.getElementById('set-quiet-end')?.value;
      body.timezone = document.getElementById('set-timezone')?.value;
      break;
    case 'autodraft':
      body.autodraft_enabled = document.getElementById('set-autodraft-enabled')?.checked;
      body.gen_time = document.getElementById('set-gen-time')?.value;
      body.num_drafts = parseInt(document.getElementById('set-num-drafts')?.value);
      body.min_bettability = parseInt(document.getElementById('set-min-bettability')?.value);
      break;
  }
  try {
    await api('/api/admin/settings', { method: 'PUT', body });
    showToast('Settings saved!', 'success');
  } catch (e) { /* toast already shown */ }
}

// ─── Helpers ─────────────────────────────────────────────────────────
function formatNum(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return String(n);
}

function debounce(fn, ms) {
  let timer;
  return function (...args) { clearTimeout(timer); timer = setTimeout(() => fn.apply(this, args), ms); };
}

function renderAndBindPage(page) {
  const el = document.getElementById('page-content');
  if (el) { el.innerHTML = renderPageContent(page); bindShellEvents(page); }
}
