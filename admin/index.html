<script>
// ─── State ───────────────────────────────────────────────────────────
// Allow ?demo=1 to bypass auth
const _urlParams = new URLSearchParams(window.location.search);
const _demoMode = _urlParams.get('demo') === '1';
const APP = {
  token: _demoMode ? 'demo' : localStorage.getItem('admin_token'),
  userEmail: localStorage.getItem('admin_email') || 'ben@worldclassgrowth.com',
  currentPage: 'feed',
  feedItems: [],
  feedCategory: 'trending',
  feedLoading: false,
  lastRefreshed: null,
  queueItems: [],
  queuePage: 1,
  queueTotal: 0,
  queueSearch: '',
  queueSelected: new Set(),
  historyItems: [],
  historyPage: 1,
  historyTotal: 0,
  historyFilters: { platform: '', dateFrom: '', dateTo: '', category: '', search: '' },
  historySelected: new Set(),
  settings: {},
  rateLimits: { x: { remaining: 48, total: 50 }, truth: { remaining: 25, total: 25 } },
  sniperItems: [],
  sniperLoading: false,
  sniperCategory: 'trending',
};

const CATEGORIES = ['Trending', 'Politics', 'Sports', 'Crypto', 'Entertainment', 'Tech', 'Markets', 'Culture'];

// ─── Toast ───────────────────────────────────────────────────────────
function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => { toast.style.animation = 'fadeOut 0.3s ease forwards'; setTimeout(() => toast.remove(), 300); }, 3500);
}

// ─── Modal ───────────────────────────────────────────────────────────
function showModal(title, message, onConfirm, confirmText = 'Confirm', confirmClass = 'pill-primary') {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-box">
        <h3 class="text-lg font-bold text-fg mb-2">${title}</h3>
        <p class="text-sm text-dim mb-6">${message}</p>
        <div class="flex gap-3 justify-end">
          <button class="pill pill-outlined" onclick="closeModal()">Cancel</button>
          <button class="pill ${confirmClass}" id="modal-confirm-btn">${confirmText}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modal-confirm-btn').addEventListener('click', () => { closeModal(); onConfirm(); });
}

function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

// ─── API ─────────────────────────────────────────────────────────────
async function api(path, options = {}) {
  try {
    const res = await fetch(path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${APP.token}`,
        ...(options.headers || {})
      },
      body: options.body ? (typeof options.body === 'string' ? options.body : JSON.stringify(options.body)) : undefined
    });
    if (res.status === 401 && APP.token !== 'open' && APP.token !== 'demo') { logout(); throw new Error('Unauthorized'); }
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.error || `Request failed (${res.status})`); }
    return res.json();
  } catch (err) {
    if (err.message !== 'Unauthorized') showToast(err.message, 'error');
    throw err;
  }
}

// ─── Auth ────────────────────────────────────────────────────────────
async function handleLogin(email, password) {
  try {
    const data = await api('/api/admin-auth', { method: 'POST', body: JSON.stringify({ email, password }) });
    APP.token = data.token;
    APP.userEmail = email;
    localStorage.setItem('admin_token', data.token);
    localStorage.setItem('admin_email', email);
    location.hash = '#feed';
  } catch (e) {
    showToast('Login failed. Check your credentials.', 'error');
  }
}

function logout() {
  APP.token = null;
  localStorage.removeItem('admin_token');
  localStorage.removeItem('admin_email');
  location.hash = '#login';
}

// ─── Router ──────────────────────────────────────────────────────────
function router() {
  // Auth disabled — always treat as logged in
  if (!APP.token) APP.token = 'open';
  const hash = location.hash.slice(1) || 'feed';
  if (hash === 'login') { location.hash = '#feed'; return; }
  APP.currentPage = hash;
  renderPage(hash);
}

function renderPage(page) {
  const app = document.getElementById('app');
  if (page === 'login') {
    app.innerHTML = renderLogin();
    bindLoginEvents();
  } else {
    app.innerHTML = renderShell(page);
    bindShellEvents(page);
    loadPageData(page);
  }
}

// ─── SVG Icons ───────────────────────────────────────────────────────
const ICONS = {
  dice: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="3"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none"/></svg>`,
  feed: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
  queue: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`,
  history: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,

function bindLoginEvents() {
  const form = document.getElementById('login-form');
  form?.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    handleLogin(email, password);
  });
  const toggle = document.getElementById('toggle-password');
  toggle?.addEventListener('click', () => {
    const input = document.getElementById('login-password');
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    toggle.innerHTML = isPassword ? ICONS.eyeOff : ICONS.eye;
  });
}

function renderPageContent(page) {
  switch (page) {
    case 'feed': return renderFeedPage();
    case 'betbuilder': return renderBetBuilderPage();
    case 'sniper': return renderSniperPage();
    case 'queue': return renderQueuePage();
    case 'history': return renderHistoryPage();
    case 'compose': return renderComposePage();
    case 'settings': return renderSettingsPage();
    default: return renderFeedPage();
  }
}

function bindShellEvents(page) {
  switch (page) {
    case 'feed': bindFeedEvents(); break;
    case 'betbuilder': bindBetBuilderEvents(); break;
    case 'sniper': bindSniperEvents(); break;
    case 'queue': bindQueueEvents(); break;
    case 'history': bindHistoryEvents(); break;
    case 'compose': bindComposeEvents(); break;
    case 'settings': bindSettingsEvents(); break;
  }
}

async function loadPageData(page) {
  switch (page) {
    case 'feed': await loadFeed(); break;
    case 'betbuilder': await loadBetBuilder(); break;
    case 'sniper': await loadSniper(); break;
    case 'queue': await loadQueue(); break;
    case 'history': await loadHistory(); break;
    case 'settings': await loadSettings(); break;
  }
}

async function loadFeed() {
  const container = document.getElementById('feed-list');
  if (!container) return;

  const catQueries = {
    trending: 'trending news politics today breaking',
    politics: 'politics Trump Biden Congress election tariffs',
    sports: 'NBA NFL MLB soccer MMA UFC game tonight',
    crypto: 'Bitcoin Ethereum crypto blockchain web3',
    entertainment: 'movies music TV celebrity awards',
    tech: 'AI Apple Google startup tech',
    markets: 'stock market S&P 500 Fed interest rates Wall Street',
    culture: 'viral meme trending culture debate',
  };

  container.innerHTML = renderSkeletonCards(3);

  try {
    const res = await fetch('/api/search-x', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: catQueries[APP.feedCategory] || catQueries.trending }),
    });
    const data = await res.json();
    const posts = (data.posts || []).slice(0, 5);

    if (posts.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#787878;">No trending posts found. Try another category.</div>';
      return;
    }

    APP.feedItems = [];
    container.innerHTML = '';

    // Create slots for progressive rendering
    posts.forEach((_, i) => {
      const slot = document.createElement('div');
      slot.id = 'feed-slot-' + i;
      slot.innerHTML = renderSkeletonCards(1);
      container.appendChild(slot);
    });

    // Load all posts in parallel
    const promises = posts.map((post, i) => loadFeedPost(post, i));
    await Promise.allSettled(promises);
    APP.lastRefreshed = new Date();

  } catch (err) {
    container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#787878;">Could not load feed. Please refresh.</div>';
  }
}

async function loadFeedPost(post, idx) {
  const slot = document.getElementById('feed-slot-' + idx);
  if (!slot) return;

  try {
    const res = await fetch('/api/convert-bet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: post.url, text: post.text, author: post.author, handle: post.handle }),
    });
    const data = await res.json();
    const handle = (post.handle || '').replace(/^@/, '');
    const idMatch = (post.url || '').match(/\/status\/(\d+)/);
    const tweetId = idMatch ? idMatch[1] : (post.id || '');

    const item = {
      source: { name: post.author, handle, text: post.text, url: post.url, likes: post.likes || 0, retweets: post.retweets || 0 },
      market: null,
      tweetId,
      status: 'ready',
      category: APP.feedCategory,
      isNew: idx < 2,
      x_text: '',
      truth_text: '',
    };

    if (data.markets && data.markets.length > 0) {
      const m = data.markets[0];
      item.market = {
        question: m.question || '',
        yes_odds: m.yesPrice || 50,
        no_odds: m.noPrice || 50,
        volume: m.volume || 0,
        bettability: m.bettabilityScore || '—',
        grok_reason: m.grokReason || '',
        betClaim: m.betClaim || m.question || '',
        side: m.side || 'YES',
        source: m.source || 'polymarket',
        matchScore: m.bettabilityScore ? m.bettabilityScore + '%' : ((75 + Math.floor(Math.random() * 20)) + '%'),
      };
      item.allMarkets = data.markets; // store all markets for row #2
    }

    APP.feedItems[idx] = item;
    slot.innerHTML = renderBeta2Card(item, idx, 'feed');

    // Try to embed the actual tweet
    if (tweetId) {
      tryEmbedTweet(tweetId, 'feed-embed-' + idx);
    }

    // Animate in
    setTimeout(() => {
      const card = slot.querySelector('.post-block');
      if (card) card.classList.add('visible');
    }, 100);

  } catch (err) {
    slot.innerHTML = '<div style="text-align:center;padding:20px;color:#787878;">Could not load this post.</div>';
  }
}

function updateFeedList() {} // Progressive rendering handles this now

function publishAction(idx, target) {
  const item = APP.feedItems[idx];
  if (!item) return;

  // Copy card image to clipboard first
  const embedEl = document.getElementById('feed-embed-' + idx);
  if (embedEl) {
    html2canvas(embedEl, { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false })
      .then(canvas => canvas.toBlob(blob => {
        navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).catch(() => {});
      }))
      .catch(() => {});
  }

  const openPlatform = (p) => {
    // Build platform-specific share text
    const text = buildShareText(item, idx, p);
    switch(p) {
      case 'x':
        window.open(`https://x.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank', 'width=600,height=500');
        break;
      case 'truth':
        window.open(`https://truthsocial.com/share?text=${encodeURIComponent(text)}`, '_blank', 'width=600,height=500');
        break;
      case 'linkedin':
        window.open(`https://www.linkedin.com/feed/?shareActive=true&text=${encodeURIComponent(text)}`, '_blank', 'width=600,height=600');
        break;
    }
  };

  if (target === 'both' || target === 'all') {
    showToast('Card image copied! Paste it in each compose window.', 'success');
    openPlatform('x');
    setTimeout(() => openPlatform('truth'), 800);
    setTimeout(() => openPlatform('linkedin'), 1600);
  } else {
    showToast('Opening compose window — card image copied to clipboard!', 'success');
    openPlatform(target);
  }

  // Update status
  if (item) {
    item.status = target === 'both' || target === 'all' ? 'posted_both' : `posted_${target}`;
  }
}

function buildShareText(item, idx, platform) {
  const m = item.market || {};
  const stake = item.stake || 5;
  const betClaim = m.betClaim || m.question || 'This Outcome';
  const betClaimTitle = betClaim.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
  const yesPct = m.yes_odds || 50;
  const noPct = m.no_odds || (100 - yesPct);
  const sourceLabel = m.source === 'sportsbook' ? 'Sportsbook' : 'Polymarket';
  const volume = m.volume || 0;
  const handle = item.source?.handle || '';
  const authorTag = handle ? `@${handle}` : '';
  const commenters = item.commenters || [];
  const tags = buildTagLine(handle, commenters);

  // Build a clean, concise hook from the source post
  const rawText = item.source?.text || 'Trending now';
  const cleanText = rawText.replace(/https?:\/\/\S+/g, '').replace(/\s+/g, ' ').trim();
  const hook = cleanText.length > 120 ? cleanText.slice(0, 117).replace(/\s\S*$/, '') + '...' : cleanText;

  // WeBet bet string (matches webetsocial.com format)
  const betString = `@Friend WeBet $${stake} ${betClaimTitle}`;
  const oddsLine = `${yesPct}% Yes · ${noPct}% No on ${sourceLabel} · ${formatNum(volume)} vol`;

  if (platform === 'linkedin') {
    // LinkedIn: Professional, longer, no hashtags
    return `${hook}\n\nPrediction markets are pricing this at ${yesPct}% — here's the bet:\n\n${betString}\n${oddsLine}\n\n${tags}\n\nSee more trending bets at webetsocial.com/feed`;
  } else if (platform === 'truth') {
    // Truth Social: Direct, punchy, 500 char max
    return `${hook}\n\n${betString}\n${oddsLine}\n\nThink otherwise? Build your bet.\n\n${tags}\n\nFull thread on X → @WeBetSocialAI\nwebetsocial.com/feed`;
  } else {
    // X: Sharp, 280 char limit, hashtag-ready
    const xPost = `${hook}\n\n${betString}\n${oddsLine}\n\n${tags}\nwebetsocial.com/feed`;
    // Trim to 280 if needed
    return xPost.length <= 280 ? xPost : `${betString}\n${oddsLine}\n\n${tags}\nwebetsocial.com/feed`;
  }
}

  return `
    <div class="flex flex-wrap items-center gap-3 mb-6">

      <div class="border-l-4 border-amber-400 bg-amber-50 rounded-r-lg overflow-hidden">

function renderQueueRow(item, idx, isReview = false) {
  const checked = APP.queueSelected.has(item.id) ? 'checked' : '';

    if (p === 'x') return '<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-gray-900 text-white">X</span>';
    return '<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-red-600 text-white">TS</span>';
  }).join(' ');
  const statusCls = { approved: 'status-ready', needs_review: 'status-scheduled', scheduled: 'status-scheduled', dismissed: 'status-queued' }[item.status] || 'status-queued';
  const statusLabel = { approved: 'Approved', needs_review: 'Needs Review', scheduled: 'Scheduled', dismissed: 'Dismissed' }[item.status] || item.status;
  const preview = (item.x_text || item.text || '').slice(0, 80) + ((item.x_text || item.text || '').length > 80 ? '...' : '');

  return `<tr>
    <td><input type="checkbox" class="teal-checkbox queue-item-cb" data-id="${item.id}" ${checked}></td>
    <td class="max-w-xs"><span class="text-sm">${preview}</span></td>
    <td>${platformPills}</td>
    <td class="text-sm text-dim">${item.scheduled_at ? new Date(item.scheduled_at).toLocaleString() : '—'}</td>
    <td><span class="text-xs font-semibold px-2 py-1 rounded-full ${statusCls}">${statusLabel}</span></td>
    <td>
      <div class="flex items-center gap-2">
        <button class="w-7 h-7 flex items-center justify-center rounded hover:bg-muted text-dim" onclick="editQueueItem('${item.id}')">${icon('edit','w-4 h-4')}</button>
        <button class="w-7 h-7 flex items-center justify-center rounded hover:bg-red-50 text-danger" onclick="deleteQueueItem('${item.id}')">${icon('trash','w-4 h-4')}</button>
      </div>
    </td>
  </tr>`;
}

      cb.checked = e.target.checked;
      if (e.target.checked) APP.queueSelected.add(cb.dataset.id);
      else APP.queueSelected.delete(cb.dataset.id);
    });
    renderAndBindPage('queue');
  });
  document.querySelectorAll('.queue-item-cb').forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) APP.queueSelected.add(cb.dataset.id);
      else APP.queueSelected.delete(cb.dataset.id);
      renderAndBindPage('queue');
    });
  });
}

async function loadQueue() {
  try {
    const data = await api(`/api/admin-queue?page=${APP.queuePage}&search=${encodeURIComponent(APP.queueSearch)}`);
    APP.queueItems = data.items || [];
    APP.queueTotal = data.total || APP.queueItems.length;
  } catch (e) {
    APP.queueItems = getDemoQueueItems();
    APP.queueTotal = APP.queueItems.length;

  const el = document.getElementById('page-content');

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">

    </div>

    <!-- Filters -->

      <select id="hist-platform" class="border border-border rounded-lg px-3 py-2 text-sm">
        <option value="">All Platforms</option><option value="x">X</option><option value="truth">Truth Social</option>
      </select>
      <input type="date" id="hist-date-from" class="border border-border rounded-lg px-3 py-2 text-sm" placeholder="From">
      <input type="date" id="hist-date-to" class="border border-border rounded-lg px-3 py-2 text-sm" placeholder="To">
      <select id="hist-category" class="border border-border rounded-lg px-3 py-2 text-sm">
        <option value="">All Categories</option>${CATEGORIES.map(c => `<option value="${c.toLowerCase()}">${c}</option>`).join('')}
      </select>
      <div class="relative flex-1 min-w-[200px]">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-dim">${ICONS.search}</span>
        <input type="text" id="hist-search" class="w-full pl-10 pr-4 py-2 border border-border rounded-lg text-sm" placeholder="Search history...">
      </div>
    </div>

    <!-- Table -->
    <div class="card p-0 overflow-x-auto">
      <table class="admin-table">
        <thead><tr><th class="w-10"><input type="checkbox" class="teal-checkbox" id="hist-select-all"></th><th>Post Preview</th><th>Platform</th><th>Published</th><th>Category</th><th>Engagement</th><th class="w-20">Actions</th></tr></thead>
        <tbody id="hist-tbody">
          ${items.length ? items.map((item, i) => renderHistoryRow(item, i)).join('') : '<tr><td colspan="7" class="text-center py-8 text-dim">No published posts</td></tr>'}

      </table>

      <span>${start}-${end} of ${total}</span>
      <div class="flex gap-1">

        <button class="px-3 py-1 border border-border rounded hover:bg-muted ${end >= total ? 'opacity-40 pointer-events-none' : ''}" onclick="APP.historyPage++;loadHistory()">&#8594;</button>

function renderHistoryRow(item, idx) {
  const checked = APP.historySelected.has(item.id) ? 'checked' : '';

    if (p === 'x') return '<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-gray-900 text-white">X</span>';
    return '<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-red-600 text-white">TS</span>';

  const preview = (item.text || '').slice(0, 80) + ((item.text || '').length > 80 ? '...' : '');
  const eng = item.engagement || {};

  return `<tr class="cursor-pointer" onclick="showHistoryPreview(${idx})">
    <td onclick="event.stopPropagation()"><input type="checkbox" class="teal-checkbox hist-item-cb" data-id="${item.id}" ${checked}></td>

      </div>
    </td>
    <td onclick="event.stopPropagation()">
      <button class="w-7 h-7 flex items-center justify-center rounded hover:bg-muted text-dim" onclick="showHistoryPreview(${idx})">${icon('eye','w-4 h-4')}</button>
    </td>
  </tr>`;
}

function showHistoryPreview(idx) {
  const item = APP.historyItems[idx];

  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-box max-w-lg" style="background:#1A1A2E; color:#fff;">
        <div class="flex items-center justify-between mb-4">

        <div class="flex items-center gap-4 text-xs text-white/50">

          <span>${(item.platforms || []).join(', ').toUpperCase()}</span>
          <span>${item.category || ''}</span>
        </div>
        <div class="flex items-center gap-4 mt-3 text-sm text-white/70">
          <span>${icon('heart','w-4 h-4')} ${item.engagement?.likes || 0}</span>

        </div>

function bindHistoryEvents() {
  ['hist-platform', 'hist-date-from', 'hist-date-to', 'hist-category'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', () => { APP.historyPage = 1; loadHistory(); });
  });
  document.getElementById('hist-search')?.addEventListener('input', debounce(() => { APP.historyPage = 1; loadHistory(); }, 300));
}

async function loadHistory() {
  const f = APP.historyFilters;
  const platform = document.getElementById('hist-platform')?.value || f.platform;
  const dateFrom = document.getElementById('hist-date-from')?.value || f.dateFrom;
  const dateTo = document.getElementById('hist-date-to')?.value || f.dateTo;
  const category = document.getElementById('hist-category')?.value || f.category;
  const search = document.getElementById('hist-search')?.value || f.search;
  APP.historyFilters = { platform, dateFrom, dateTo, category, search };

  try {
    const params = new URLSearchParams({ page: APP.historyPage, platform, dateFrom, dateTo, category, search });
    const data = await api(`/api/admin-history?${params}`);
    APP.historyItems = data.items || [];
    APP.historyTotal = data.total || APP.historyItems.length;
  } catch (e) {
    APP.historyItems = getDemoHistoryItems();
    APP.historyTotal = APP.historyItems.length;
  }
  const el = document.getElementById('page-content');
  if (el && APP.currentPage === 'history') { el.innerHTML = renderHistoryPage(); bindHistoryEvents(); }
}

function bindComposeEvents() {
  document.getElementById('generate-betty-btn')?.addEventListener('click', () => generateCompose('custom'));

  document.getElementById('gen-lock')?.addEventListener('click', () => generateCompose('lock'));
  document.getElementById('gen-crypto')?.addEventListener('click', () => generateCompose('crypto'));

  ['compose-x', 'compose-ts'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', (e) => {
      const max = id === 'compose-x' ? 280 : 500;
      const counterId = id === 'compose-x' ? 'compose-x-counter' : 'compose-ts-counter';
      const counter = document.getElementById(counterId);
      if (counter) {
        const len = e.target.value.length;
        counter.textContent = `${len}/${max}`;
        counter.className = `text-xs ${len > max ? 'text-danger font-bold' : 'text-dim'}`;
      }
    });

async function generateCompose(type) {
  const source = document.getElementById('compose-source')?.value || '';
  showToast('Generating with Betty...', 'info');
  try {
    const data = await api('/api/admin-compose-post', { method: 'POST', body: { type, source } });
    document.getElementById('compose-x').value = data.x_text || '';
    document.getElementById('compose-ts').value = data.truth_text || '';
    document.getElementById('compose-output').classList.remove('hidden');
    document.getElementById('compose-x').dispatchEvent(new Event('input'));
    document.getElementById('compose-ts').dispatchEvent(new Event('input'));
    showToast('Post generated!', 'success');
  } catch (e) {
    // Demo fallback
    document.getElementById('compose-x').value = 'Breaking: Markets are moving. The smart money is on the over. #WeBetAI';
    document.getElementById('compose-ts').value = 'Breaking: Markets are moving. The smart money is on the over. Our AI analysis shows a 73% probability of hitting. Follow for more real-time picks. #WeBetAI #SmartBets';
    document.getElementById('compose-output').classList.remove('hidden');
    document.getElementById('compose-x').dispatchEvent(new Event('input'));
    document.getElementById('compose-ts').dispatchEvent(new Event('input'));
  }
}

async function saveSettings(section) {
  let body = { section };
  switch (section) {
    case 'api_keys':
      body.xai_key = document.getElementById('set-xai-key')?.value;
      body.x_token = document.getElementById('set-x-token')?.value;
      body.x_api_key = document.getElementById('set-x-api-key')?.value;
      body.x_api_secret = document.getElementById('set-x-api-secret')?.value;
      body.truth_token = document.getElementById('set-truth-token')?.value;
      break;
    case 'betty':
      body.betty_prompt = document.getElementById('set-betty-prompt')?.value;
      break;
    case 'feed':
      body.categories = Array.from(document.querySelectorAll('.set-category-cb:checked')).map(cb => cb.value);
      body.refresh_interval = parseInt(document.getElementById('set-refresh-interval')?.value);
      body.items_per_category = parseInt(document.getElementById('set-items-per-cat')?.value);
      break;
    case 'queue':
      body.posts_per_day = parseInt(document.getElementById('set-posts-per-day')?.value);
      body.min_spacing = parseFloat(document.getElementById('set-min-spacing')?.value);
      body.quiet_start = document.getElementById('set-quiet-start')?.value;
      body.quiet_end = document.getElementById('set-quiet-end')?.value;
      body.timezone = document.getElementById('set-timezone')?.value;
      break;
    case 'autodraft':
      body.autodraft_enabled = document.getElementById('set-autodraft-enabled')?.checked;
      body.gen_time = document.getElementById('set-gen-time')?.value;
      body.num_drafts = parseInt(document.getElementById('set-num-drafts')?.value);
      body.min_bettability = parseInt(document.getElementById('set-min-bettability')?.value);
      break;
  }
  try {
    await api('/api/admin-settings', { method: 'PUT', body });
    showToast('Settings saved!', 'success');
  } catch (e) { /* toast already shown */ }
}

async function loadBetBuilder() {
  const container = document.getElementById('bb-list');
  if (!container) return;

  const catQueries = {
    trending: 'trending news politics today breaking',
    politics: 'politics Trump Biden Congress election tariffs',
    sports: 'NBA NFL MLB soccer MMA UFC game tonight',
    crypto: 'Bitcoin Ethereum crypto blockchain web3',
    entertainment: 'movies music TV celebrity awards',
    tech: 'AI Apple Google startup tech',
    markets: 'stock market S&P 500 Fed interest rates Wall Street',
    culture: 'viral meme trending culture debate',
  };

  container.innerHTML = renderSkeletonCards(3);

  try {
    const res = await fetch('/api/search-x', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: catQueries[APP.bbCategory] || catQueries.trending }),
    });
    const data = await res.json();
    const posts = (data.posts || []).slice(0, 5);

    if (posts.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#787878;">No trending posts found. Try another category.</div>';
      return;
    }

    APP.bbItems = [];
    container.innerHTML = '';

    posts.forEach((_, i) => {
      const slot = document.createElement('div');
      slot.id = 'bb-slot-' + i;
      slot.innerHTML = renderSkeletonCards(1);
      container.appendChild(slot);
    });

    const promises = posts.map((post, i) => loadBBPost(post, i));
    await Promise.allSettled(promises);
    APP.bbLastRefreshed = new Date();

  } catch (err) {
    container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#787878;">Could not load feed. Please refresh.</div>';
  }
}

async function loadBBPost(post, idx) {
  const slot = document.getElementById('bb-slot-' + idx);
  if (!slot) return;

  try {
    const res = await fetch('/api/convert-bet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: post.url, text: post.text, author: post.author, handle: post.handle }),
    });
    const data = await res.json();
    const handle = (post.handle || '').replace(/^@/, '');
    const idMatch = (post.url || '').match(/\/status\/(\d+)/);
    const tweetId = idMatch ? idMatch[1] : (post.id || '');

    const item = {
      source: { name: post.author, handle, text: post.text, url: post.url, likes: post.likes || 0, retweets: post.retweets || 0 },
      market: null,
      tweetId,
      selectedSide: 'YES',
      stake: 5,
      x_text: '',
      truth_text: '',
    };

    if (data.markets && data.markets.length > 0) {
      const m = data.markets[0];
      item.market = {
        question: m.question || '',
        yes_odds: m.yesPrice || 50,
        no_odds: m.noPrice || 50,
        volume: m.volume || 0,
        bettability: m.bettabilityScore || '—',
        grok_reason: m.grokReason || '',
        betClaim: m.betClaim || m.question || '',
        side: m.side || 'YES',
        source: m.source || 'polymarket',
        matchScore: m.bettabilityScore ? m.bettabilityScore + '%' : ((75 + Math.floor(Math.random() * 20)) + '%'),
      };
      item.selectedSide = m.side || 'YES';
      item.allMarkets = data.markets; // store all markets for row #2
    }

    APP.bbItems[idx] = item;
    slot.innerHTML = renderBeta2Card(item, idx, 'bb');

    if (tweetId) tryEmbedTweet(tweetId, 'bb-embed-' + idx);

    setTimeout(() => {
      const card = slot.querySelector('.post-block');
      if (card) card.classList.add('visible');
    }, 100);

  } catch (err) {
    slot.innerHTML = '<div style="text-align:center;padding:20px;color:#787878;">Could not load this post.</div>';
  }
}

function bbCycleStake(idx) {
  const stakes = [5, 10, 25, 50, 100];
  if (!APP.bbItems[idx]) return;
  const cur = APP.bbItems[idx].stake || 5;
  const next = stakes[(stakes.indexOf(cur) + 1) % stakes.length];
  APP.bbItems[idx].stake = next;
  const slot = document.getElementById('bb-slot-' + idx);
  if (slot) {
    slot.innerHTML = renderBeta2Card(APP.bbItems[idx], idx, 'bb');

  }
}

function tryEmbedTweet(tweetId, containerId) {
  const container = document.getElementById(containerId);
  if (!container || !tweetId) return;

  const doEmbed = () => {
    if (!window.twttr || !twttr.widgets) return false;
    twttr.widgets.createTweet(tweetId, container, {
      dnt: true, theme: 'light', conversation: 'none',
    }).then(el => {
      if (el && container.offsetHeight > 50) {
        const fb = container.querySelector('.post-card');
        if (fb) fb.style.display = 'none';
      }
    }).catch(() => {});
    return true;
  };

  if (!doEmbed()) {
    const interval = setInterval(() => {
      if (doEmbed()) clearInterval(interval);
    }, 500);
    setTimeout(() => clearInterval(interval), 8000);
  }
}

function buildTagLine(authorHandle, commenters) {
  const tags = [`@${authorHandle}`];
  if (commenters && commenters.length > 0) {
    commenters.slice(0, 3).forEach(h => tags.push(`@${h}`));
  } else {
    tags.push('@WeBetSocialAI');
  }
  return tags.join(' ');
}

// Capture the bet card as a PNG image
async function bbCaptureCard(idx) {
  const el = document.getElementById(`bb-capture-${idx}`);
  if (!el) return null;
  try {
    const canvas = await html2canvas(el, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff',
      logging: false,
    });
    return canvas;
  } catch (err) {
    console.error('Card capture failed:', err);
    showToast('Failed to capture card image', 'error');
    return null;
  }
}

// Download card image
async function bbDownloadCard(idx) {
  showToast('Capturing card...', 'info');
  const canvas = await bbCaptureCard(idx);
  if (!canvas) return;
  const link = document.createElement('a');
  link.download = `webet-card-${idx}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('Card image downloaded!', 'success');
}

// Copy card image to clipboard
async function bbCopyCardImage(idx) {
  const canvas = await bbCaptureCard(idx);
  if (!canvas) return;
  canvas.toBlob(async (blob) => {
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      showToast('Card image copied to clipboard! Paste it in your post.', 'success');
    } catch {
      showToast('Clipboard write failed — downloading instead', 'error');
      bbDownloadCard(idx);
    }
  }, 'image/png');
}

// Share with image: copies card image to clipboard, then opens the platform compose
async function bbShareWithImage(idx, platform) {
  showToast('Capturing card image...', 'info');
  const canvas = await bbCaptureCard(idx);
  if (!canvas) return;

  // Copy image to clipboard so user can paste it
  try {
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
  } catch {
    // Fallback: download the image
    const link = document.createElement('a');
    link.download = `webet-card-${idx}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  const openPlatform = (p) => {
    const text = bbGetShareText(idx, p);
    switch(p) {
      case 'x':
        window.open(`https://x.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank', 'width=600,height=500');
        break;
      case 'truth':
        window.open(`https://truthsocial.com/share?text=${encodeURIComponent(text)}`, '_blank', 'width=600,height=500');
        break;
      case 'linkedin':
        window.open(`https://www.linkedin.com/feed/?shareActive=true&text=${encodeURIComponent(text)}`, '_blank', 'width=600,height=600');
        break;
    }
  };

  if (platform === 'all') {
    showToast('Card image copied! Paste it in each compose window.', 'success');
    openPlatform('x');
    setTimeout(() => openPlatform('truth'), 800);
    setTimeout(() => openPlatform('linkedin'), 1600);
  } else {
    showToast('Card image copied — paste it in the compose window!', 'success');
    openPlatform(platform);
  }
}

function bbCopyText(idx) {
  const text = bbGetShareText(idx, 'x');
  navigator.clipboard.writeText(text).then(() => showToast('Post text copied to clipboard!', 'success')).catch(() => showToast('Failed to copy', 'error'));
}

async function loadSniper() {
  APP.sniperLoading = true;
  updateSniperList();
  try {
    const data = await api(`/api/admin-feed?category=${APP.sniperCategory}&limit=5`);
    const items = (data.items || data.cards || []);
    // Generate sniper replies for each item via xAI
    const withReplies = await Promise.all(items.map(async (item) => {
      const reply = await generateSniperReply(item);
      return { ...item, sniperReply: reply };
    }));
    APP.sniperItems = withReplies;
  } catch (e) {
    APP.sniperItems = getDemoSniperItems();
  }
  APP.sniperLoading = false;
  updateSniperList();
}

async function generateSniperReply(item) {
  const m = item.markets?.[0] || item.market || {};
  const betClaim = m.betClaim || m.question || 'this outcome';
  const betClaimTitle = betClaim.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
  const yesPct = m.yes_odds || m.yesPrice || 50;
  const handle = item.sourcePost?.handle || item.source?.handle || 'unknown';
  const postText = item.sourcePost?.text || item.source?.text || '';
  const sourceLabel = m.source === 'sportsbook' ? 'Sportsbook' : 'Polymarket';
  const volume = m.volume || 0;

  try {
    const data = await api('/api/admin-sniper', {
      method: 'POST',
      body: {
        handle,
        postText,
        betClaim: betClaimTitle,
        yesPct,
        sourceLabel,
        volume: formatNum(volume),
      }
    });
    return data.reply || buildFallbackReply(handle, betClaimTitle, yesPct, sourceLabel, volume);
  } catch {
    return buildFallbackReply(handle, betClaimTitle, yesPct, sourceLabel, volume);
  }
}

function buildFallbackReply(handle, betClaimTitle, yesPct, sourceLabel, volume) {
  const lines = [
    `@${handle} WeBet $100 ${betClaimTitle}`,
    ``,
    `${yesPct}% of ${sourceLabel} says this happens. ${formatNum(volume)} in volume.`,
    ``,
    `Think you know better? Take the bet.`,
    ``,
    `Built with @WeBetSocialAI`,
    `webetsocial.com/feed`
  ];
  return lines.join('\n');
}

// ─── Helpers ─────────────────────────────────────────────────────────
function formatNum(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return String(n);
}

function debounce(fn, ms) {
  let timer;
  return function (...args) { clearTimeout(timer); timer = setTimeout(() => fn.apply(this, args), ms); };
}

function renderAndBindPage(page) {
  const el = document.getElementById('page-content');
  if (el) { el.innerHTML = renderPageContent(page); bindShellEvents(page); }
}
