  <style>
    :root {
      --green: #004C54;
      --green-light: #006B6E;
      --teal: #00b5b9;
      --sans: 'Geist Sans', -apple-system, system-ui, sans-serif;
      --mono: 'Geist Mono', ui-monospace, SFMono-Regular, 'Roboto Mono', monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--sans);
      background: #000;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════════════════════════════
       HERO SECTION — full viewport, x.ai-inspired
    ═══════════════════════════════════════════════════════════ */
    .hero {
      position: relative;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* Globe video background */
    .globe-bg {
      position: absolute; inset: 0; z-index: 0;
    }
    .globe-bg video {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center center;
    }
    .globe-bg::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 1;
    }

    /* ─── NAV ─────────────────────────────────────────────── */
    .nav {
      position: relative; z-index: 10;
      height: 64px; padding: 0 32px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .nav-left {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
    }
    .nav-wordmark {
      font-size: 1.125rem; font-weight: 700;
      color: #ffffff; letter-spacing: -0.04em;
    }
    .nav-cta {
      font-family: var(--mono); font-size: 13px; font-weight: 400;
      color: #ffffff; text-decoration: none;
      padding: 9px 20px; border-radius: 9999px;
      border: 1.5px solid rgba(255,255,255,0.35);
      letter-spacing: 1px; text-transform: uppercase;
      transition: all 0.25s;
    }
    .nav-cta:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.6);
    }

    /* ─── HERO CONTENT — centered block ───────────────────── */
    .hero-body {
      position: relative; z-index: 10;
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 0 24px;
      gap: 0;
    }

    .hero-portrait {
      width: 120px; height: 120px;
      border-radius: 50%; object-fit: cover;
      border: 3px solid rgba(255,255,255,0.4);
      box-shadow: 0 0 0 6px rgba(255,255,255,0.06), 0 0 60px rgba(0,0,0,0.4);
      margin-bottom: 20px;
    }

    .hero-brand {
      font-size: clamp(42px, 6vw, 64px);
      font-weight: 400;
      letter-spacing: -2px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .hero-tagline {
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 20px;
    }

    .hero-sub {
      font-size: 17px; font-weight: 400;
      color: rgba(255,255,255,0.7);
      line-height: 26px;
      max-width: 560px;
      margin-bottom: 28px;
    }

    /* ─── CHIPS + INPUT — bottom of hero ──────────────────── */
    .hero-input-block {
      position: relative; z-index: 10;
      flex-shrink: 0;
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      padding: 0 24px 0;
    }

    .chips {
      display: flex; flex-wrap: nowrap;
      gap: 10px; margin-bottom: 10px;
      justify-content: center;
    }
    .chip {
      font-family: var(--mono); font-size: 13px; font-weight: 400;
      color: rgba(255,255,255,0.65);
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 9999px; padding: 10px 28px;
      cursor: pointer; transition: all 0.25s;
      text-align: center; white-space: nowrap;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .chip:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.13);
    }

    .input-wrap {
      position: relative;
    }
    .input-box {
      width: 100%;
      min-height: 100px;
      padding: 18px 64px 18px 22px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: none;
      border-radius: 24px;
      color: #ffffff;
      font-family: var(--sans);
      font-size: 16px; line-height: 24px;
      resize: none; outline: none;
      box-shadow: 0 0 0 1.5px rgba(255,255,255,0.18);
      transition: box-shadow 0.2s;
    }
    .input-box::placeholder { color: rgba(255,255,255,0.4); }
    .input-box:focus { box-shadow: 0 0 0 2px rgba(255,255,255,0.35); }

    .send-btn {
      position: absolute; right: 14px; bottom: 14px;
      width: 40px; height: 40px;
      border-radius: 50%; border: none;
      background: rgba(255,255,255,0.18);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0.4; transition: all 0.25s;
    }
    .send-btn.active { opacity: 1; }
    .send-btn:hover.active { background: rgba(255,255,255,0.3); }
    .send-btn svg { width: 18px; height: 18px; }

    /* ─── SCROLL ARROW ────────────────────────────────────── */
    .hero-footer {
      position: relative; z-index: 10;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 32px 20px;
    }
    .scroll-arrow {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      transition: color 0.2s;
      background: none; border: none;
    }
    .scroll-arrow:hover { color: rgba(255,255,255,0.8); }
    .hero-footer-links {
      display: flex; gap: 20px;
      font-family: var(--mono); font-size: 11px;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.3);
    }
    .hero-footer-links a {
      color: rgba(255,255,255,0.3); text-decoration: none;
      transition: color 0.2s;
    }
    .hero-footer-links a:hover { color: rgba(255,255,255,0.7); }

    /* ═══════════════════════════════════════════════════════════
       BELOW FOLD — Betty section (green/white from webetsocial.com)
    ═══════════════════════════════════════════════════════════ */
    .below-fold {
      background: #f0f7f6;
      color: #1a1a1a;
    }

    .sec {
      padding: 80px 24px;
      max-width: 1080px;
      margin: 0 auto;
    }
    .sec-alt {
      background: #fff;
      max-width: none;
      padding-left: 24px; padding-right: 24px;
    }
    .sec-alt > * {
      max-width: 1080px;
      margin-left: auto; margin-right: auto;
    }
    .sec-cta {
      background: var(--green);
      max-width: none;
      padding-left: 24px; padding-right: 24px;
    }
    .sec-cta > * {
      max-width: 1080px;
      margin-left: auto; margin-right: auto;
    }
    .sec-header {
      text-align: center;
      margin-bottom: 56px;
    }
    .sec-tag {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 12px;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--green);
      margin-bottom: 14px;
    }
    .sec-h2 {
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 600; letter-spacing: -0.02em;
      color: #1a1a1a; margin-bottom: 12px;
    }
    .sec-sub {
      font-size: 16px; color: #5a5a5a;
      line-height: 1.65; max-width: 560px;
      margin: 0 auto;
    }

    /* Betty layout */
    .betty-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: center;
    }

    .betty-card {
      background: #fff;
      border: 1px solid rgba(0,76,84,0.12);
      border-radius: 20px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06);
    }
    .betty-card-portrait {
      width: 100px; height: 100px;
      border-radius: 50%; object-fit: cover;
      border: 3px solid var(--green);
      margin-bottom: 16px;
    }
    .betty-card-name {
      font-size: 1.25rem; font-weight: 700;
      color: #1a1a1a; margin-bottom: 2px;
    }
    .betty-card-handle {
      font-size: 0.8125rem; color: #888;
      margin-bottom: 16px;
    }
    .betty-card-stats {
      display: flex; justify-content: center; gap: 24px;
      margin-bottom: 16px;
    }
    .betty-card-stat-val {
      font-size: 1.125rem; font-weight: 700; color: var(--green);
    }
    .betty-card-stat-lbl {
      font-size: 0.6875rem; color: #888;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .betty-card-bio {
      font-size: 0.8125rem; color: #5a5a5a;
      line-height: 1.6; margin-bottom: 20px;
    }
    .betty-card-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 24px;
      background: var(--green); color: #fff;
      border: none; border-radius: 9999px;
      font-family: var(--sans); font-size: 0.875rem; font-weight: 500;
      cursor: pointer; transition: background 0.2s;
      text-decoration: none;
    }
    .betty-card-btn:hover { background: var(--green-light); }

    .betty-traits { display: flex; flex-direction: column; gap: 24px; }
    .betty-trait {
      display: flex; align-items: flex-start; gap: 14px;
    }
    .betty-trait-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(0,76,84,0.08);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .betty-trait-title {
      font-size: 0.9375rem; font-weight: 600;
      color: #1a1a1a; margin-bottom: 4px;
    }
    .betty-trait-body {
      font-size: 0.8125rem; color: #5a5a5a;
      line-height: 1.6;
    }

    /* Features grid */
    .feat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .feat-grid-2 { grid-template-columns: repeat(2, 1fr); }
    .feat-grid-1 { grid-template-columns: 1fr; }
    .feat-card {
      background: #fff;
      border: 1px solid rgba(0,76,84,0.1);
      border-radius: 16px;
      padding: 28px;
    }
    .feat-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: rgba(0,76,84,0.08);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
    }
    .feat-title {
      font-size: 0.9375rem; font-weight: 600;
      color: #1a1a1a; margin-bottom: 8px;
    }
    .feat-body {
      font-size: 0.8125rem; color: #5a5a5a;
      line-height: 1.6;
    }
    .step-card {
      display: flex; gap: 20px; align-items: flex-start;
    }
    .step-num {
      font-family: var(--mono); font-size: 24px; font-weight: 700;
      color: var(--green); opacity: 0.3; flex-shrink: 0; line-height: 1;
    }
    .testimonial-card {
      border-left: 3px solid var(--green); text-align: left;
    }
    .testimonial-stars {
      color: #d4a017; margin-bottom: 8px; font-size: 1rem;
    }
    .testimonial-text {
      font-style: italic; font-size: 0.9375rem; margin-bottom: 10px;
      color: #5a5a5a; line-height: 1.6;
    }
    .testimonial-author {
      font-size: 0.8125rem; font-weight: 600; color: var(--green);
    }

    /* CTA section */
    .cta-heading { color: #fff !important; }
    .cta-sub-text { color: rgba(255,255,255,0.75) !important; }
    .cta-buttons {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
    }
    .cta-btn-primary {
      display: inline-flex; align-items: center;
      background: #fff; color: var(--green);
      font-family: var(--sans); font-size: 1rem; font-weight: 500;
      padding: 14px 32px; border-radius: 9999px;
      text-decoration: none; transition: opacity 0.2s;
    }
    .cta-btn-primary:hover { opacity: 0.9; }
    .cta-btn-secondary {
      display: inline-flex; align-items: center;
      background: transparent; color: #fff;
      font-family: var(--sans); font-size: 1rem; font-weight: 500;
      padding: 14px 32px; border-radius: 9999px;
      border: 1.5px solid rgba(255,255,255,0.4);
      text-decoration: none; transition: all 0.2s;
    }
    .cta-btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.6); }
    .cta-legal {
      text-align: center; margin-top: 16px;
      font-size: 0.75rem; color: rgba(255,255,255,0.45);
    }

    /* Footer */
    .site-footer {
      background: #0a0a0a;
      color: rgba(255,255,255,0.4);
      padding: 32px 24px;
      text-align: center;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    .site-footer a {
      color: rgba(255,255,255,0.4); text-decoration: none;
      margin: 0 12px;
    }
    .site-footer a:hover { color: #fff; }

    /* ═══════════════════════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .nav { padding: 0 20px; height: 56px; }
      .nav-wordmark { font-size: 1.125rem; }
      .nav-cta { font-size: 13px; padding: 8px 18px; }

      .hero-portrait { width: 130px; height: 130px; margin-bottom: 18px; }
      .hero-brand { font-size: 48px; letter-spacing: -1.5px; }
      .hero-tagline { font-size: 13px; letter-spacing: 3px; margin-bottom: 16px; }
      .hero-sub { font-size: 17px; line-height: 26px; margin-bottom: 24px; max-width: 420px; }

      .hero-input-block { padding: 0 20px; }
      .chips { flex-wrap: wrap; justify-content: center; gap: 8px; }
      .chip { flex: none; font-size: 14px; padding: 10px 20px; }
      .input-box { min-height: 80px; border-radius: 20px; font-size: 17px; padding: 18px 56px 18px 20px; }
      .send-btn { width: 40px; height: 40px; right: 12px; bottom: 12px; }

      .hero-footer { padding: 10px 20px 16px; }

      .betty-grid { grid-template-columns: 1fr; gap: 32px; }
      .feat-grid, .feat-grid-2, .feat-grid-1 { grid-template-columns: 1fr; }
      .sec { padding: 56px 20px; }
      .sec-alt, .sec-cta { padding-left: 20px; padding-right: 20px; }
    }

    @media (max-width: 430px) {
      .nav { padding: 0 16px; }
      .nav-cta { font-size: 12px; padding: 7px 16px; }

      .hero-portrait { width: 120px; height: 120px; margin-bottom: 16px; }
      .hero-brand { font-size: 42px; }
      .hero-tagline { font-size: 12px; letter-spacing: 2.5px; margin-bottom: 14px; }
      .hero-sub { font-size: 16px; line-height: 24px; margin-bottom: 22px; max-width: 360px; }

      .hero-input-block { padding: 0 16px; }
      .chip { font-size: 13px; padding: 9px 18px; }
      .input-box { min-height: 76px; padding: 16px 52px 16px 18px; font-size: 16px; }

      .hero-footer { padding: 8px 16px 14px; }
    }

    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .hero-footer { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     HERO — above the fold
═══════════════════════════════════════════════════════════ -->
<section class="hero">
  <div class="globe-bg">
    <video src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260309_042944_4a2205b7-b061-490a-852b-92d9e9955ce9.mp4" autoplay loop muted playsinline></video>
  </div>

  <nav class="nav">
    <a href="/" class="nav-left">
      <svg viewBox="0 0 470 419" fill="none" style="width:28px;height:24px;" xmlns="http://www.w3.org/2000/svg">
        <path d="M468.052 41.8933C475.338 21.4744 460.199 0 438.52 0H258.273C244.592 0 232.491 8.86935 228.372 21.915L224.279 34.8759C248.801 41.3632 269.435 57.9169 281.086 80.4478L294.349 106.096C294.585 106.553 294.786 106.963 294.999 107.431C298.607 115.353 334.405 193.978 357.551 245.403C365.813 263.759 378.664 292.426 378.664 292.426L468.052 41.8933Z" fill="#FFFFFF"/>
        <path d="M2.5744 90.1347C-6.41714 56.7413 22.8839 25.563 56.7707 32.4661L209.173 63.5124C228.73 67.4964 245.223 80.5515 253.59 98.6714L370.845 352.594C385.077 383.414 362.565 418.605 328.618 418.605H139.079C110.723 418.605 85.8955 399.578 78.523 372.198L2.5744 90.1347Z" fill="#004C54"/>
      </svg>
      <span class="nav-wordmark">WeBetAI</span>
    </a>
    <div>
      <a href="/dashboard" class="nav-cta">Try WeBetAI</a>
    </div>
  </nav>

  <div class="hero-body">
    <img class="hero-portrait" src="https://imagine-public.x.ai/imagine-public/share-images/79ef03da-8e8d-4fc2-8aa7-2d8d645b5b7f.jpg?cache=1" alt="Betty" />
    <h1 class="hero-brand">WeBetAI</h1>
    <p class="hero-tagline">Social Intelligence</p>
    <p class="hero-sub">Meet Betty, your AI companion for all things news, sports, politics, prediction markets, and entertainment. She reads all of social media, so you don't have to. Ask her anything.</p>
  </div>

  <div class="hero-input-block">
    <div class="chips" id="chips">
      <button class="chip" data-prompt="What's trending right now?">What's trending right now?</button>
      <button class="chip" data-prompt="Give me today's daily digest">Give me today's daily digest</button>
      <button class="chip" data-prompt="Best sportsbook picks tonight?">Best sportsbook picks tonight?</button>
    </div>
    <div class="input-wrap">
      <textarea class="input-box" id="input" rows="1" placeholder="What do you want to know?" autocomplete="off" spellcheck="false"></textarea>
      <button class="send-btn" id="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="hero-footer"></div>
</section>


<script>
  var inputEl = document.getElementById('input');
  var sendBtn = document.getElementById('send-btn');

  function autoResize() {
    inputEl.style.height = 'auto';
    var h = Math.min(inputEl.scrollHeight, 200);
    if (h > 80) inputEl.style.height = h + 'px';
    else inputEl.style.height = '';
    sendBtn.classList.toggle('active', inputEl.value.trim().length > 0);
  }

  function handleSend() {
    var text = inputEl.value.trim();
    if (!text) return;
    window.location.href = '/dashboard?q=' + encodeURIComponent(text);
  }

  inputEl.addEventListener('input', autoResize);
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
  });
  sendBtn.addEventListener('click', handleSend);

  document.querySelectorAll('.chip').forEach(function(chip) {
    chip.addEventListener('click', function() {
      inputEl.value = this.getAttribute('data-prompt');
      handleSend();
    });
  });

  if (window.innerWidth > 768) inputEl.focus();
</script>

</body>
