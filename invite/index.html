  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Geist Sans', system-ui, sans-serif; background: #f2f3f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: #fff; border: 1px solid #e0e3e8; border-radius: 1rem; padding: 2rem 1.5rem; width: 100%; max-width: 380px; }
    .logo { display: flex; align-items: center; gap: .5rem; margin-bottom: 1.5rem; }
    .logo svg { width: 24px; height: 20px; }
    .logo-text { font-size: 1rem; font-weight: 700; color: #1a2e1a; }
    h1 { font-size: 1.125rem; font-weight: 700; color: #1a2e1a; margin-bottom: .25rem; }
    .sub { font-size: .8125rem; color: #5f6b7a; margin-bottom: 1.25rem; }
    label { font-size: .75rem; font-weight: 600; color: #5f6b7a; display: block; margin-bottom: .25rem; }
    input { width: 100%; font-family: inherit; font-size: .9375rem; padding: .625rem .75rem; border: 1px solid #e0e3e8; border-radius: .5rem; background: #f8f9fa; outline: none; margin-bottom: 1rem; }
    input:focus { border-color: #004C54; background: #fff; }
    button { width: 100%; font-family: inherit; font-size: .9375rem; font-weight: 700; padding: .75rem; border: none; border-radius: .5rem; background: #004C54; color: #fff; cursor: pointer; transition: background .15s; }
    button:hover { background: #1a2e1a; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .result { margin-top: 1rem; font-size: .8125rem; text-align: center; }
    .result.ok { color: #2e7d32; }
    .result.err { color: #c0392b; }
    .history { margin-top: 1.5rem; border-top: 1px solid #e0e3e8; padding-top: 1rem; }
    .history-title { font-size: .6875rem; font-weight: 700; color: #8b95a3; text-transform: uppercase; letter-spacing: .04em; margin-bottom: .5rem; }
    .history-item { font-size: .8125rem; color: #5f6b7a; padding: .25rem 0; border-bottom: 1px solid #f0f1f3; }
    .history-item span { color: #1a2e1a; font-weight: 600; }
    .contact-btn { width: 100%; font-family: inherit; font-size: .8125rem; font-weight: 600; padding: .5rem; border: 1px solid #b8ddd6; border-radius: .5rem; background: #e6f4f1; color: #004C54; cursor: pointer; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; gap: .375rem; transition: all .15s; }
    .contact-btn:hover { background: #004C54; color: #fff; }
    .contact-btn svg { width: 16px; height: 16px; }
    .divider { display: flex; align-items: center; gap: .75rem; margin-bottom: 1rem; font-size: .6875rem; color: #8b95a3; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e0e3e8; }

<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 470 419" fill="none"><path d="M468.052 41.8933C475.338 21.4744 460.199 0 438.52 0H258.273C244.592 0 232.491 8.86935 228.372 21.915L224.279 34.8759C248.801 41.3632 269.435 57.9169 281.086 80.4478L294.349 106.096C294.585 106.553 294.786 106.963 294.999 107.431C298.607 115.353 334.405 193.978 357.551 245.403C365.813 263.759 378.664 292.426 378.664 292.426L468.052 41.8933Z" fill="#004C54"/><path d="M2.5744 90.1347C-6.41714 56.7413 22.8839 25.563 56.7707 32.4661L209.173 63.5124C228.73 67.4964 245.223 80.5515 253.59 98.6714L370.845 352.594C385.077 383.414 362.565 418.605 328.618 418.605H139.079C110.723 418.605 85.8955 399.578 78.523 372.198L2.5744 90.1347Z" fill="#004C54"/></svg>
      <span class="logo-text">WeBetAI</span>
    </div>
    <h1>Send Betty Invite</h1>
    <div class="sub">Betty will text them the intro + picks + contact card.</div>

    <label>First name</label>
    <input id="name" placeholder="Chris" autocomplete="given-name" />

    <label>Phone number</label>
    <input id="phone" placeholder="919-480-7270" type="tel" autocomplete="tel" />

    <button id="btn" onclick="sendInvite()">Send Invite</button>
    <div id="result" class="result"></div>

    <div class="history" id="history"></div>
  </div>

  <script>
    var sent = JSON.parse(localStorage.getItem('betty_invites') || '[]');
    renderHistory();

    async function pickContact() {
      // Try Contact Picker API (Android Chrome, future iOS)
      if ('contacts' in navigator && 'ContactsManager' in window) {
        try {
          var contacts = await navigator.contacts.select(['name', 'tel'], { multiple: false });
          if (contacts && contacts.length > 0) {
            var c = contacts[0];
            if (c.name && c.name[0]) document.getElementById('name').value = c.name[0].split(' ')[0];
            if (c.tel && c.tel[0]) document.getElementById('phone').value = c.tel[0];
            return;
          }
        } catch (e) {
          // User cancelled or not supported
        }
      }

      // Fallback: focus the phone input with tel autocomplete — iOS will suggest contacts
      var phoneInput = document.getElementById('phone');
      phoneInput.focus();
      // Briefly set to search type to trigger iOS contact suggestions
      phoneInput.setAttribute('autocomplete', 'tel');
      phoneInput.click();
    }

    async function sendInvite() {
      var name = document.getElementById('name').value.trim();
      var phone = document.getElementById('phone').value.trim().replace(/\D/g, '');
      var btn = document.getElementById('btn');
      var result = document.getElementById('result');

      if (!name) { result.className = 'result err'; result.textContent = 'Enter a name'; return; }
      if (phone.length < 10) { result.className = 'result err'; result.textContent = 'Enter a valid phone number'; return; }

      if (phone.length === 10) phone = '1' + phone;
      var fullPhone = '+' + phone;

      btn.disabled = true;
      btn.textContent = 'Sending...';
      result.textContent = '';

      try {
        // Message 1: Square photo + intro
        var resp1 = await fetch('/api/betty-sms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: fullPhone,
            message: 'Hey ' + name + '! I\'m Betty from WeBetAI. Today\'s Edge picks just dropped — check them out:\n\nwebetsocial.com/edge-beta\n\nAsk me anything as your AI companion for all things sports, news, politics, prediction markets, and entertainment.',
            mediaUrl: 'https://webetsocial.com/betty-sms.jpg?v=20260818'
          })
        });

        // Small delay
        await new Promise(function(r) { setTimeout(r, 2000); });

        // Message 2: vCard
        var resp2 = await fetch('/api/betty-sms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: fullPhone,
            message: 'Save my contact card!',
            mediaUrl: 'https://webetsocial.com/betty.vcf?v=20260818'
          })
        });

        if (resp1.ok && resp2.ok) {
          result.className = 'result ok';
          result.textContent = 'Sent to ' + name + '!';
          sent.unshift({ name: name, phone: fullPhone, ts: new Date().toLocaleString() });
          localStorage.setItem('betty_invites', JSON.stringify(sent.slice(0, 20)));
          renderHistory();
          document.getElementById('name').value = '';
          document.getElementById('phone').value = '';
        } else {
          result.className = 'result err';
          result.textContent = 'Failed to send. Try again.';
        }
      } catch (e) {
        result.className = 'result err';
        result.textContent = 'Error: ' + e.message;
      }

      btn.disabled = false;
      btn.textContent = 'Send Invite';
    }

    function renderHistory() {
      var el = document.getElementById('history');
      if (sent.length === 0) { el.innerHTML = ''; return; }
      el.innerHTML = '<div class="history-title">Sent</div>' +
        sent.map(function(s) {
          return '<div class="history-item"><span>' + s.name + '</span> ' + s.phone + ' — ' + s.ts + '</div>';
        }).join('');
    }
  </script>
</body>
