<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>WeBetAI - Social Intelligence | Live AI Picks</title>
  <meta name="description" content="Private live AI selections feed — internal page." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://webetsocial.com/live-ai" />
  <meta property="og:title" content="WeBetAI - Social Intelligence | Live AI Picks" />
  <meta property="og:description" content="Private live AI selections feed — internal page." />
  <meta property="og:image" content="https://webetsocial.com/edge-og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="WeBetAI - Social Intelligence | Live AI Picks" />
  <meta name="twitter:description" content="Private live AI selections feed — internal page." />
  <meta name="twitter:image" content="https://webetsocial.com/edge-og-image.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/500.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/600.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/700.css" />
  <style>
    :root {
      --primary: #87fb89;
      --primary-dim: rgba(135, 251, 137, 0.12);
      --bg: #0a0812;
      --card-bg: rgba(255, 255, 255, 0.035);
      --border: rgba(255, 255, 255, 0.09);
      --txt: #fff;
      --txt-m: rgba(255, 255, 255, 0.62);
      --amber: #fbc487;
      --red: #fb9287;
      --sans: 'Geist Sans', -apple-system, system-ui, sans-serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--sans); background: var(--bg); color: var(--txt); -webkit-font-smoothing: antialiased; min-height: 100vh; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 28px 18px 64px; }
    .page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .src { color: var(--txt-m); font-size: 0.8rem; }
    .src b { color: var(--primary); font-weight: 600; }
    .private-tag { display: inline-block; font-size: 0.66rem; font-weight: 600; letter-spacing: 0.08em; color: var(--amber); border: 1px solid rgba(251,196,135,.35); border-radius: 6px; padding: 2px 8px; margin-left: 8px; vertical-align: 2px; }
    .meta-line { color: var(--txt-m); font-size: 0.78rem; margin: 4px 0 22px; }
    .banner { border-radius: 12px; padding: 14px 16px; font-size: 0.85rem; line-height: 1.55; margin: 14px 0; border: 1px solid; }
    .banner.warn { border-color: rgba(251,196,135,.4); background: rgba(251,196,135,.07); color: var(--amber); }
    .banner.err  { border-color: rgba(251,146,135,.4); background: rgba(251,146,135,.07); color: var(--red); }
    .banner code { background: rgba(255,255,255,.08); border-radius: 4px; padding: 1px 6px; font-size: 0.78rem; }
    .grid { display: flex; flex-direction: column; gap: 12px; }
    .sel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .sel .main { flex: 1 1 240px; min-width: 0; }
    .pick { font-size: 1.05rem; font-weight: 600; }
    .meta { color: var(--txt-m); font-size: 0.78rem; margin-top: 3px; }
    .badge { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.06em; border-radius: 6px; padding: 4px 9px; }
    .badge.HIGH { color: var(--primary); background: var(--primary-dim); }
    .badge.MEDIUM { color: var(--amber); background: rgba(251,196,135,.12); }
    .badge.LOW { color: var(--red); background: rgba(251,146,135,.12); }
    .score { text-align: center; min-width: 64px; }
    .score .n { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
    .score .l { font-size: 0.62rem; letter-spacing: 0.08em; color: var(--txt-m); text-transform: uppercase; }
    .lines { display: flex; align-items: center; gap: 8px; color: var(--txt-m); font-size: 0.85rem; }
    .lines b { color: var(--txt); font-weight: 600; }
    .lg { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.06em; color: var(--txt-m); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .tag { font-size: 0.68rem; border-radius: 5px; padding: 2px 7px; border: 1px solid; }
    .tag.pro { color: var(--primary); border-color: rgba(135,251,137,.3); background: rgba(135,251,137,.06); }
    .tag.con { color: var(--red); border-color: rgba(251,146,135,.3); background: rgba(251,146,135,.06); }
    .tag.neu { color: var(--txt-m); border-color: var(--border); }
    .empty { text-align: center; color: var(--txt-m); padding: 3rem 1rem; font-size: 0.9rem; }
    /* passcode gate */
    .gate { max-width: 360px; margin: 18vh auto 0; text-align: center; }
    .gate h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
    .gate p { color: var(--txt-m); font-size: 0.82rem; margin-bottom: 18px; }
    .gate input { width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--txt); font-family: var(--sans); font-size: 0.95rem; padding: 12px 14px; outline: none; text-align: center; }
    .gate input:focus { border-color: var(--primary); }
    .gate button { margin-top: 12px; width: 100%; background: var(--primary); color: #05240a; border: 0; border-radius: 10px; font-family: var(--sans); font-weight: 700; font-size: 0.9rem; padding: 12px; cursor: pointer; }
    .gate .err-msg { color: var(--red); font-size: 0.78rem; margin-top: 10px; min-height: 1em; }
    footer { text-align: center; color: var(--txt-m); font-size: 0.72rem; margin-top: 46px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="gate" class="gate" style="display:none;">
      <h2>Private page</h2>
      <p>Enter the access key to view Live AI Picks.</p>
      <input id="gate-key" type="password" placeholder="Access key" autocomplete="off" />
      <button onclick="submitKey()">Unlock</button>
      <div id="gate-err" class="err-msg"></div>
    </div>

    <div id="app" style="display:none;">
      <div class="page-head">
        <h1>Live AI Picks<span class="private-tag">PRIVATE</span></h1>
        <div class="src">Source: <b>TSP.Live · Hermes A.I.</b> (member feed)</div>
      </div>
      <div class="meta-line" id="meta-line">Loading…</div>
      <div id="banners"></div>
      <div class="grid" id="grid"></div>
      <footer>WeBetAI - Social Intelligence · internal use only · not for redistribution</footer>
    </div>
  </div>

  <script>
    var KEY_LS = 'tsp_page_key';
    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

    function showGate(msg) {
      document.getElementById('app').style.display = 'none';
      document.getElementById('gate').style.display = 'block';
      document.getElementById('gate-err').textContent = msg || '';
    }
    function submitKey() {
      var v = document.getElementById('gate-key').value.trim();
      if (!v) return;
      try { localStorage.setItem(KEY_LS, v); } catch (e) {}
      load(v);
    }
    document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && document.getElementById('gate').style.display !== 'none') submitKey(); });

    function banner(cls, html) { return '<div class="banner ' + cls + '">' + html + '</div>'; }

    function render(data) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      var banners = '';
      var metaBits = [];
      if (data.version) metaBits.push(esc(data.version));
      if (data.count != null) metaBits.push(data.count + ' selections');
      if (data.fetchedAt) {
        var ageMin = Math.round((Date.now() - new Date(data.fetchedAt).getTime()) / 60000);
        metaBits.push('updated ' + (ageMin <= 1 ? 'just now' : ageMin + ' min ago'));
        if (ageMin > 40) banners += banner('warn', 'This card may be stale (last successful fetch ' + ageMin + ' min ago).');
      }
      document.getElementById('meta-line').textContent = metaBits.join(' · ');

      if (data.status === 'NO_COOKIE') banners += banner('err', 'Fetcher is not configured: set <code>TSP_SESSION_COOKIE</code> in Netlify env (your tsp.live member cookie), then redeploy.');
      if (data.status === 'AUTH_EXPIRED') banners += banner('err', 'TSP.Live session expired — paste a fresh <code>TSP_SESSION_COOKIE</code> into Netlify env and redeploy.');
      if (data.status === 'FETCH_ERROR') banners += banner('err', 'Could not reach TSP.Live on the last attempt' + (data.httpStatus ? ' (HTTP ' + esc(data.httpStatus) + ')' : '') + '.');
      if (data.status === 'PARSE_EMPTY') banners += banner('warn', 'Logged in, but no selection cards were found — empty slate or TSP markup changed.');
      if (data.lastError) banners += banner('warn', 'Latest refresh failed (' + esc(data.lastError.status) + ' at ' + esc(new Date(data.lastError.at).toLocaleTimeString()) + ') — showing the last good card.');
      document.getElementById('banners').innerHTML = banners;

      var grid = document.getElementById('grid');
      var sels = data.selections || [];
      if (!sels.length) { grid.innerHTML = '<div class="empty">No selections to show.</div>'; return; }
      grid.innerHTML = sels.map(function (s) {
        var lines = '';
        if (s.open != null || s.current != null) {
          lines = '<div class="lines">Open <b>' + esc(s.open) + '</b> → <b>' + esc(s.current) + '</b>' + (s.delta ? ' <span>(' + esc(s.delta) + ')</span>' : '') + '</div>';
        }
        var tags = '';
        (s.pros || []).forEach(function (p) { tags += '<span class="tag pro">' + esc(p) + '</span>'; });
        (s.neutral || []).forEach(function (n) { tags += '<span class="tag neu">' + esc(n) + '</span>'; });
        (s.cons || []).forEach(function (c) { tags += '<span class="tag con">' + esc(c) + '</span>'; });
        return '<div class="sel">' +
          '<div class="main">' +
            '<div class="pick">' + esc(s.pick) + (s.league ? '<span class="lg">' + esc(s.league) + '</span>' : '') + '</div>' +
            '<div class="meta">' + esc(s.gameTimeET || s.meta) + '</div>' +
            (tags ? '<div class="tags">' + tags + '</div>' : '') +
          '</div>' +
          lines +
          (s.aiScore != null ? '<div class="score"><div class="n">' + esc(s.aiScore) + '</div><div class="l">Hermes</div></div>' : '') +
          (s.confidence ? '<div class="badge ' + esc(s.confidence) + '">' + esc(s.confidence) + '</div>' : '') +
          '</div>';
      }).join('');
    }

    function load(key) {
      fetch('/api/get-tsp-live?key=' + encodeURIComponent(key))
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
        .then(function (res) {
          if (res.status === 401) { try { localStorage.removeItem(KEY_LS); } catch (e) {} showGate('Wrong key.'); return; }
          if (res.status === 503) { showGate('Page not configured yet (TSP_PAGE_KEY env var missing).'); return; }
          render(res.j);
        })
        .catch(function () { showGate('Network error — try again.'); });
    }

    var saved = null;
    try { saved = localStorage.getItem(KEY_LS); } catch (e) {}
    if (saved) load(saved); else showGate();
    setInterval(function () {
      var k = null; try { k = localStorage.getItem(KEY_LS); } catch (e) {}
      if (k && document.getElementById('app').style.display !== 'none') load(k);
    }, 60000);
  </script>
</body>
</html>
