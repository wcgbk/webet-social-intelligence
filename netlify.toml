# Admin dashboard — serve from /admin path and app.webetsocial.com subdomain
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Subdomain routing: app.webetsocial.com → admin dashboard
[[redirects]]
  from = "https://app.webetsocial.com/*"
  to = "/admin/index.html"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "https://app.webetsocial.com/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://app.webetsocial.com"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://app.webetsocial.com/*"
  to = "/admin/index.html"
  status = 200
  force = true

# Blog articles from blobs (static files take precedence, this catches blob-stored articles)
[[redirects]]
