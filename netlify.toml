[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "nft"

[functions."build-ratings-background"]
  # Background function — 15min timeout for Elo rating computation

[functions."trigger-picks"]
  # schedule = "0 14 * * *"
  # PAUSED — alpha pipeline is now the primary picks pipeline

[functions."trigger-picks-beta"]
  # schedule = "0 14 * * *"
  # PAUSED — alpha pipeline is now the primary picks pipeline

[functions."trigger-picks-alpha"]
  schedule = "0 13 * * *"
  # Alpha pipeline — 9am EDT (13:00 UTC), 1hr earlier than beta for max CLV runway
  # Writes to edge-picks-alpha blob store. Model: v10.2-alpha-calibrated

[functions."generate-picks-alpha-background"]
  # Background function — 15min timeout for Alpha pick generation

[functions."trigger-picks-mvp"]
  schedule = "0 12 * * *"
  # MVP pipeline — 8am EDT (12:00 UTC), 1hr before alpha for max CLV runway comparison
  # Writes to edge-picks-mvp blob store. Model: v11.0-mvp
  # v11.0 improvements: Poisson soccer, grade Kelly mult, adversarial A+ check, sport-diverse parlays

[functions."generate-picks-mvp-background"]
  # Background function — 15min timeout for MVP pick generation

[functions."trigger-picks-mlb"]
  # schedule = "0 14 * * *"
  # PAUSED 2026-07-03 — F5 is folded into alpha (v10.3-alpha-sharp), the sole production
  # pipeline. The standalone edge-picks-mlb store lacked alpha's guardrails (no de-vig, 2%
  # edge floor, no high-total skip, half-Kelly) and bled -21% ROI / -20u on F5 ML underdogs
  # (n=134). Do NOT re-enable without backporting alpha's guardrails or consolidating to alpha.
  # MLB F5 pipeline — daily at 10am EDT.

[functions."generate-picks-mlb-background"]
  # Background function — 15min timeout for MLB F5 pick generation

[functions."confirm-starters-mlb"]
  # schedule = "30 17 * * *"
  # PAUSED 2026-07-03 — support cron for the now-paused trigger-picks-mlb pipeline; nothing
  # to confirm once F5 generation is off. Re-enable together with trigger-picks-mlb.
  # 17:30 UTC = 1:30pm EDT. Re-checks ESPN starters 3.5h after picks generate.
  # Flags scratched starters with scratchWarning on the pick — no re-generation.

[functions."trigger-picks-props"]
  # schedule = "0 14 * * *"
  # PAUSED — cost reduction. Re-enable to restore /props daily picks.
  # Player Props pipeline — daily at 10am EDT, writes to edge-picks-props blob store

[functions."generate-picks-props-background"]
  # Background function — 15min timeout for player props pick generation

[functions."trigger-picks-mlb-props"]
  # schedule = "0 14 * * *"
  # PAUSED — cost reduction. Re-enable to restore /mlb-props daily picks.
  # MLB Strikeout Props — daily at 10am EDT, writes to edge-picks-mlb-props blob store

[functions."generate-picks-mlb-props-background"]
  # Background function — 15min timeout for MLB K props generation

[functions."trigger-kalshi"]
  # schedule = "0 15 * * *"
  # PAUSED — paper trading mode active. Live execution paused until /prediction-markets KPIs verified.
  # Re-enable once accuracy targets confirmed (see webetsocial.com/prediction-markets).

[functions."trigger-kalshi-scan"]
  # schedule = "30 15,19,23 * * *"
  # PAUSED — prediction-markets page paused 2026-06-03. Re-enable to resume Kalshi scanning.
  # Independent scanner — 3x daily:
  # 15:30 UTC = 11:30am EDT (after picks + execution)
  # 19:00 UTC = 3:00pm EDT (afternoon price movement)
  # 23:00 UTC = 7:00pm EDT (evening pre-game)

[functions."generate-picks-beta-background"]
  # Background function — 15min timeout for beta pick generation

[functions."generate-picks-be-background"]
  # Background function — 15min timeout for BettorEdge-enhanced pick generation

[functions."trigger-clv"]
  schedule = "0 7,17,23 * * *"
  # 07:00 UTC = 3am EDT (overnight settle — track-clv re-invokes itself for YESTERDAY so night
  # games get results written before the 8am/9am pick runs read bankroll/drawdown state).
  # 17:00 UTC = 1pm EDT (afternoon games). 23:00 UTC = 7pm EDT (evening games). Merges results.

[functions."capture-opening-lines"]
  schedule = "0 10 * * *"
  # 10:00 UTC = 6am EDT. Capture early morning lines before US sharp action.
  # 4-hour window before 10am picks maximizes line movement detection.

[functions."verify-picks"]
  schedule = "30 14 * * *"
  # 14:30 UTC = 10:30am EDT. Runs 30min after picks to verify math + narrative.

[functions."self-optimize"]
  schedule = "0 9 * * 0"
  # 09:00 UTC = 5am EDT every Sunday. Weekly self-optimization cycle.

[functions."trigger-trend-monitor"]
  schedule = "0 1 * * *"
  # 01:00 UTC = 9pm EDT, after the 23:00 track-clv settle. Fires the trend-monitor HTTP
  # function (kept plain so /api/trend-monitor stays reliably on-demand). Negative-trend
  # tracker: grades alpha picks vs ESPN (independent of the leaky settle write-back), computes
  # realized ROI by segment (sport×market×segment×side), raises ALARM on bleeding segments
  # (n>=40, ROI<=-10%, Wilson-low < breakeven). Detection only — writes trend-monitor-latest
  # blob. Would've flagged F5-ML-dog at ~bet 40, not 134.

# ── FOX: 3-AI Consensus Picks Pipeline (standalone) ──
[functions."generate-fox-background"]
  # Background function — 15min timeout for FOX 3-AI consensus pipeline

[functions."trigger-fox"]
  # schedule = "30 14 * * *"
  # PAUSED — 3-AI consensus pipeline failing (only ChatGPT responding). Re-enable when fixed.
  # 14:30 UTC = 10:30am EDT. Runs 30min after regular picks.

[functions."calibrate-95"]
  schedule = "0 8 * * *"
  # 08:00 UTC = 4am EDT. Grade yesterday's picks and update calibration curves overnight.

[functions."admin-auto-draft"]
  # schedule = "0 12 * * *"
  # PAUSED 2026-06-03 — AskAPAI/Truth processes paused. Re-enable to resume morning digest.
  # 12:00 UTC = 7am EST / 8am EDT. Auto-generate morning feed digest.

[functions."admin-queue-process"]
  # schedule = "*/15 * * * *"
  # PAUSED 2026-06-03 — AskAPAI/Truth processes paused. Re-enable to resume post queue.
  # Every 15 minutes. Process scheduled posts in the queue.

[functions."generate-webet-content-background"]
  # Background function — 15min timeout for WeBet Truth Social content pipeline

[functions."generate-truth-content-background"]
  # Background function — 15min timeout for Authentic Press content generation

[functions."trigger-truth"]
  # schedule = "0 12,14,16,18,20,22 * * *"
  # PAUSED — cost reduction. Re-enable to restore /truth 6x daily generation.
  # Every 2 hours from 8am-6pm EDT (12-22 UTC). Generates stories + reply drafts.

# ── GUARDIAN: Daily Digest Pipeline ──
[functions."generate-guardian-background"]
  # Background function — 15min timeout for Guardian digest generation

[functions."trigger-guardian"]
  # schedule = "0 13 * * *"
  # PAUSED 2026-06-03 — AskAPAI/Truth processes paused. Re-enable to resume Guardian digest.
  # 13:00 UTC = 9am EDT. Daily Guardian digest scan.

# ── MATCHING ENGINE: WeBet Social Feed (feed/beta2) ──
[functions."matching-engine-background"]
  # Background function — 15min timeout for topic matching + bet string generation
  # Sources: Metaforecast, Reddit JSON, TrendsTools, X API, xAI Grok

