<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeBetAI - Social Intelligence | P2P Bet</title>
  <meta name="description" content="View and accept a P2P sports bet challenge on WeBetAI." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://webetsocial.com/p2p-sports/bet/" />
  <meta property="og:title" content="WeBetAI - Social Intelligence | P2P Bet Challenge" />
  <meta property="og:description" content="You've been challenged to a P2P bet! View details and accept." />
  <meta property="og:image" content="https://webetsocial.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="WeBetAI - Social Intelligence | P2P Bet Challenge" />
  <meta name="twitter:description" content="You've been challenged to a P2P bet! View details and accept." />
  <meta name="twitter:image" content="https://webetsocial.com/og-image.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/500.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/600.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/700.css" />
  <style>
    :root{--white:#fff;--off-white:#f8f9fa;--bg:#f2f3f5;--teal:#004C54;--teal-light:#e6f4f1;--teal-border:#b8ddd6;--green:#2e7d32;--green-light:#e8f5e9;--green-border:#a5d6a7;--olive:#1a2e1a;--border:#e0e3e8;--txt:#1a2e1a;--txt-m:#5f6b7a;--txt-l:#8b95a3;--red:#c0392b;--amber:#f39c12}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Geist Sans','Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;min-height:100vh}

    .hdr{background:var(--white);border-bottom:1px solid var(--border);padding:.875rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .logo{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--olive)}
    .logo-text{font-size:1rem;font-weight:700}
    .hdr-badge{font-size:.625rem;font-weight:600;color:var(--teal);background:var(--teal-light);border:1px solid var(--teal-border);border-radius:9999px;padding:.2rem .6rem}

    .main{max-width:520px;margin:0 auto;padding:1.5rem 1rem 3rem}

    /* Bet card */
    .bet-card{background:var(--white);border:1px solid var(--border);border-radius:1rem;padding:1.5rem;margin-bottom:1rem}
    .bc-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap}
    .bc-sport{font-size:.6875rem;font-weight:600;color:var(--teal);background:var(--teal-light);border:1px solid var(--teal-border);border-radius:6px;padding:.175rem .5rem;text-transform:uppercase}
    .bc-status{font-size:.625rem;font-weight:700;border-radius:9999px;padding:.2rem .6rem;text-transform:uppercase}
    .st-pending{background:#fff3cd;color:#856404;border:1px solid #ffc107}
    .st-active{background:var(--green-light);color:var(--green);border:1px solid var(--green-border)}
    .st-resolved{background:var(--teal-light);color:var(--teal);border:1px solid var(--teal-border)}
    .st-declined{background:#fce4e4;color:var(--red);border:1px solid #f5b7b7}
    .st-expired{background:var(--off-white);color:var(--txt-l);border:1px solid var(--border)}

    .bc-matchup{font-size:1.25rem;font-weight:700;color:var(--olive);margin-bottom:.5rem}
    .bc-webet{font-size:.9375rem;font-weight:600;color:var(--teal);background:var(--teal-light);border:1px solid var(--teal-border);border-radius:.5rem;padding:.75rem 1rem;margin-bottom:1rem;text-align:center;line-height:1.4}

    .bc-sides{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:center;margin-bottom:1rem}
    .bc-side{background:var(--off-white);border:1px solid var(--border);border-radius:.75rem;padding:.75rem;text-align:center}
    .bc-side.winner{background:var(--green-light);border-color:var(--green-border)}
    .bc-side.loser{background:#fce4e4;border-color:#f5b7b7}
    .side-name{font-size:.8125rem;font-weight:700;color:var(--olive);margin-bottom:.25rem}
    .side-team{font-size:.75rem;font-weight:500;color:var(--txt-m)}
    .side-amt{font-size:1rem;font-weight:700;color:var(--green);margin-top:.25rem}
    .vs{font-size:.875rem;font-weight:700;color:var(--txt-l)}

    .bc-odds{text-align:center;font-size:.875rem;color:var(--txt-m);margin-bottom:1rem;padding:.5rem;background:var(--off-white);border-radius:.5rem}
    .bc-odds strong{color:var(--olive)}

    .bc-score{text-align:center;font-size:1.125rem;font-weight:700;color:var(--olive);padding:.75rem;background:var(--off-white);border-radius:.5rem;margin-bottom:1rem}
    .bc-result{text-align:center;font-size:1rem;font-weight:700;padding:.625rem;border-radius:.5rem;margin-bottom:1rem}
    .res-win{background:var(--green-light);color:var(--green);border:1px solid var(--green-border)}
    .res-loss{background:#fce4e4;color:var(--red);border:1px solid #f5b7b7}

    /* Action buttons */
    .actions{display:flex;gap:.5rem;margin-bottom:1rem}
    .actions button{flex:1;font-family:inherit;font-size:.875rem;font-weight:700;padding:.75rem;border-radius:.5rem;cursor:pointer;transition:.15s}
    .btn-accept{background:var(--teal);color:var(--white);border:none}
    .btn-accept:hover{background:#003a40}
    .btn-decline{background:var(--white);color:var(--red);border:1px solid #f5b7b7}
    .btn-decline:hover{background:#fce4e4}
    .btn-counter{background:var(--white);color:var(--amber);border:1px solid #fde68a}
    .btn-counter:hover{background:#fef9c3}
    .actions button:disabled{opacity:.5;cursor:not-allowed}

    /* Counter form */
    .counter-form{display:none;background:var(--off-white);border:1px solid var(--border);border-radius:.5rem;padding:.75rem;margin-bottom:1rem}
    .counter-form.show{display:block}
    .cf-row{display:flex;gap:.5rem;align-items:center}
    .cf-input{flex:1;font-family:inherit;font-size:.875rem;font-weight:600;padding:.5rem .625rem;border:1px solid var(--border);border-radius:.5rem;background:var(--white)}
    .cf-input:focus{outline:none;border-color:var(--teal)}
    .cf-send{font-family:inherit;font-size:.8125rem;font-weight:600;padding:.5rem .75rem;border:none;border-radius:.5rem;background:var(--amber);color:var(--white);cursor:pointer}

    /* Name input for acceptance */
    .name-form{background:var(--off-white);border:1px solid var(--border);border-radius:.5rem;padding:.75rem;margin-bottom:1rem}
    .nf-label{font-size:.6875rem;font-weight:600;color:var(--txt-m);margin-bottom:.25rem}
    .nf-input{width:100%;font-family:inherit;font-size:.875rem;padding:.5rem .625rem;border:1px solid var(--border);border-radius:.5rem;background:var(--white);margin-bottom:.5rem}
    .nf-input:focus{outline:none;border-color:var(--teal)}

    /* Timeline */
    .timeline{margin-top:1rem}
    .tl-title{font-size:.6875rem;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.5rem}
    .tl-evt{display:flex;align-items:center;gap:.5rem;padding:.375rem 0;font-size:.75rem;color:var(--txt-m);border-bottom:1px solid #f0f1f3}
    .tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .tl-dot.teal{background:var(--teal)}
    .tl-dot.green{background:var(--green)}
    .tl-dot.red{background:var(--red)}
    .tl-dot.amber{background:var(--amber)}

    /* Share */
    .share-box{background:var(--white);border:1px solid var(--border);border-radius:1rem;padding:1.25rem;text-align:center}
    .share-title{font-size:.6875rem;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.625rem}
    .share-link{display:flex;align-items:center;gap:.5rem;background:var(--off-white);border:1px solid var(--border);border-radius:.5rem;padding:.5rem .75rem;margin-bottom:.75rem}
    .share-link input{flex:1;font-family:inherit;font-size:.75rem;border:none;background:none;color:var(--olive);font-weight:600}
    .share-link button{font-family:inherit;font-size:.6875rem;font-weight:600;padding:.3rem .625rem;border:1px solid var(--teal-border);border-radius:6px;background:var(--teal-light);color:var(--teal);cursor:pointer;transition:.15s}
    .share-link button:hover{background:var(--teal);color:var(--white)}
    .share-btns{display:flex;gap:.375rem;justify-content:center}
    .share-btn{font-family:inherit;font-size:.75rem;font-weight:600;padding:.5rem .875rem;border-radius:.5rem;cursor:pointer;transition:.15s;border:1px solid var(--border);background:var(--white);color:var(--olive)}
    .share-btn:hover{border-color:var(--teal);color:var(--teal)}

    .loading{text-align:center;padding:4rem 1rem}
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto .75rem}
    @keyframes spin{to{transform:rotate(360deg)}}
    .msg{font-size:.8125rem;color:var(--txt-m);text-align:center;padding:1rem}
    .err{font-size:.8125rem;color:var(--red);text-align:center;padding:3rem 1rem}

    .back-link{display:inline-flex;align-items:center;gap:.375rem;font-size:.75rem;font-weight:500;color:var(--teal);text-decoration:none;margin-bottom:1rem}
    .back-link:hover{text-decoration:underline}

    .ftr{text-align:center;padding:1rem;font-size:.625rem;color:var(--txt-l)}
    .ftr a{color:var(--teal);text-decoration:none}

    @media(max-width:480px){
      .bc-sides{grid-template-columns:1fr;gap:.375rem}
      .vs{display:none}
      .actions{flex-direction:column}
    }
  </style>
</head>
<body>
  <header class="hdr">
    <a href="/" class="logo">
      <svg width="20" height="20" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#004C54"/><path d="M8 22L12 10l4 8 4-5 4 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="logo-text">WeBetAI</span>
    </a>
    <span class="hdr-badge">P2P Bet</span>
  </header>

  <main class="main" id="app">
    <div class="loading"><div class="spinner"></div><div class="msg">Loading bet...</div></div>
  </main>

  <div class="ftr"><a href="/">WeBetAI</a> &middot; P2P Sports</div>

<script>
const params = new URLSearchParams(window.location.search);
const betId = params.get('id');

if (!betId) {
  document.getElementById('app').innerHTML = '<div class="err">No bet ID provided. Check your link.</div>';
} else {
  loadBet();
}

async function loadBet() {
  try {
    const r = await fetch(`/api/get-p2p-bet?id=${betId}`);
    const data = await r.json();
    if (data.error || !data.id) {
      document.getElementById('app').innerHTML = `<div class="err">${data.error || 'Bet not found'}</div>`;
      return;
    }
    renderBet(data);
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="err">Failed to load bet: ${e.message}</div>`;
  }
}

function renderBet(bet) {
  const st = bet.status;
  const stClass = st === 'pending' ? 'st-pending' : st === 'active' ? 'st-active' : st === 'resolved' ? 'st-resolved' : st === 'declined' ? 'st-declined' : 'st-expired';
  const stLabel = st.charAt(0).toUpperCase() + st.slice(1);

  const payout = bet.payout || calcPay(bet.odds, bet.amountDisplay);

  let html = `<a href="/p2p-sports" class="back-link">&larr; Back to P2P Sports</a>`;

  html += `<div class="bet-card">
    <div class="bc-top">
      <span class="bc-sport">${bet.sport || 'Sports'}</span>
      <span class="bc-status ${stClass}">${stLabel}</span>
    </div>
    <div class="bc-matchup">${bet.matchup || bet.event || 'P2P Bet'}</div>
    <div class="bc-webet">${bet.webetString || bet.betText || bet.proposition}</div>

    <div class="bc-sides">
      <div class="bc-side ${bet.result === 'initiator_wins' ? 'winner' : bet.result === 'counterparty_wins' ? 'loser' : ''}">
        <div class="side-name">${bet.initiatorName || bet.initiatorHandle || 'Challenger'}</div>
        <div class="side-team">${bet.initiatorSide || bet.proposition}</div>
        <div class="side-amt">$${bet.amountDisplay}</div>
      </div>
      <div class="vs">VS</div>
      <div class="bc-side ${bet.result === 'counterparty_wins' ? 'winner' : bet.result === 'initiator_wins' ? 'loser' : ''}">
        <div class="side-name">${bet.counterpartyName || bet.counterpartyHandle || 'Opponent'}</div>
        <div class="side-team">${bet.counterpartySide || 'Opposite side'}</div>
        <div class="side-amt">$${bet.amountDisplay}</div>
      </div>
    </div>`;

  if (bet.odds) {
    html += `<div class="bc-odds">Odds: <strong>${fmtOdds(bet.odds)}</strong> &middot; Potential payout: <strong>$${(bet.amountDisplay + payout).toFixed(2)}</strong></div>`;
  }

  if (bet.finalScore) {
    html += `<div class="bc-score">${bet.finalScore}</div>`;
  }

  if (bet.result) {
    const isInitWin = bet.result === 'initiator_wins';
    html += `<div class="bc-result ${isInitWin ? 'res-win' : 'res-loss'}">${isInitWin ? (bet.initiatorName || 'Challenger') : (bet.counterpartyName || 'Opponent')} wins $${bet.amountDisplay}!</div>`;
  }

  html += '</div>';

  // Actions for pending bets
  if (st === 'pending') {
    html += `<div class="name-form" id="nameForm">
      <div class="nf-label">Your name (so they know who accepted)</div>
      <input class="nf-input" id="respName" placeholder="Your name or @handle">
      <div class="nf-label">Your phone (optional — get SMS updates)</div>
      <input class="nf-input" id="respPhone" type="tel" placeholder="+1 (555) 123-4567">
    </div>
    <div class="actions" id="actions">
      <button class="btn-accept" id="acceptBtn" onclick="acceptBet()">Accept Bet</button>
      <button class="btn-counter" onclick="showCounter()">Counter</button>
      <button class="btn-decline" onclick="declineBet()">Decline</button>
    </div>
    <div class="counter-form" id="counterForm">
      <div class="nf-label">Counter with a different amount</div>
      <div class="cf-row">
        <span style="font-weight:700;color:var(--olive)">$</span>
        <input class="cf-input" id="counterAmt" type="number" min="1" placeholder="Amount">
        <button class="cf-send" onclick="counterBet()">Send Counter</button>
      </div>
    </div>`;
  }

  // Share section
  const shareUrl = bet.shareUrl || `https://webetsocial.com/p2p-sports/bet/?id=${bet.id}`;
  html += `<div class="share-box">
    <div class="share-title">Share This Bet</div>
    <div class="share-link">
      <input id="shareUrl" value="${shareUrl}" readonly onclick="this.select()">
      <button onclick="copyLink()">Copy</button>
    </div>
    <div class="share-btns">
      <button class="share-btn" onclick="window.open('sms:?body='+encodeURIComponent('Check out this P2P bet: ${shareUrl}'),'_blank')">Text</button>
      <button class="share-btn" onclick="window.open('https://x.com/intent/tweet?text='+encodeURIComponent('P2P bet on WeBetAI! ${shareUrl}'),'_blank')">Post on X</button>
    </div>
  </div>`;

  // Timeline
  if (bet.events && bet.events.length) {
    html += `<div class="timeline"><div class="tl-title">Activity</div>`;
    for (const ev of bet.events) {
      const dotClass = ev.type === 'created' ? 'teal' : ev.type === 'accepted' ? 'green' : ev.type === 'declined' ? 'red' : ev.type === 'countered' ? 'amber' : 'teal';
      const time = ev.ts ? new Date(ev.ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
      let label = ev.type.charAt(0).toUpperCase() + ev.type.slice(1);
      if (ev.type === 'countered' && ev.amount) label += ` ($${ev.amount})`;
      if (ev.actor) label += ` by ${ev.actor}`;
      html += `<div class="tl-evt"><div class="tl-dot ${dotClass}"></div>${label}<span style="margin-left:auto;font-size:.625rem;color:var(--txt-l)">${time}</span></div>`;
    }
    html += '</div>';
  }

  document.getElementById('app').innerHTML = html;
}

async function acceptBet() {
  const btn = document.getElementById('acceptBtn');
  btn.disabled = true; btn.textContent = 'Accepting...';
  const name = document.getElementById('respName')?.value.trim() || '';
  const phone = document.getElementById('respPhone')?.value.trim() || '';

  try {
    const r = await fetch('/api/accept-p2p-bet-web', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ betId, action: 'accept', responderName: name, responderPhone: phone })
    });
    const data = await r.json();
    if (data.success) {
      renderBet(data.bet);
    } else {
      alert('Error: ' + (data.error || data.message));
      btn.disabled = false; btn.textContent = 'Accept Bet';
    }
  } catch (e) {
    alert('Network error: ' + e.message);
    btn.disabled = false; btn.textContent = 'Accept Bet';
  }
}

async function declineBet() {
  if (!confirm('Are you sure you want to decline?')) return;
  const name = document.getElementById('respName')?.value.trim() || '';
  try {
    const r = await fetch('/api/accept-p2p-bet-web', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ betId, action: 'decline', responderName: name })
    });
    const data = await r.json();
    if (data.success) renderBet(data.bet);
    else alert('Error: ' + (data.error || data.message));
  } catch (e) { alert('Network error: ' + e.message); }
}

function showCounter() {
  document.getElementById('counterForm').classList.toggle('show');
}

async function counterBet() {
  const amt = parseFloat(document.getElementById('counterAmt').value);
  if (!amt || amt <= 0) { alert('Enter a valid amount'); return; }
  const name = document.getElementById('respName')?.value.trim() || '';
  const phone = document.getElementById('respPhone')?.value.trim() || '';

  try {
    const r = await fetch('/api/accept-p2p-bet-web', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ betId, action: 'counter', responderName: name, responderPhone: phone, counterAmount: amt })
    });
    const data = await r.json();
    if (data.success) {
      alert('Counter offer sent! Waiting for response.');
      renderBet(data.bet);
    } else alert('Error: ' + (data.error || data.message));
  } catch (e) { alert('Network error: ' + e.message); }
}

function copyLink() {
  const el = document.getElementById('shareUrl');
  el.select();
  navigator.clipboard.writeText(el.value).then(() => {
    el.parentElement.querySelector('button').textContent = 'Copied!';
    setTimeout(() => el.parentElement.querySelector('button').textContent = 'Copy', 2000);
  });
}

function calcPay(odds, w) {
  if (!w || !odds) return 0;
  return odds >= 0 ? w * (odds / 100) : w * (100 / Math.abs(odds));
}

function fmtOdds(o) {
  const n = Math.round(o);
  return n >= 0 ? '+' + n : '' + n;
}
</script>
</body>
</html>
