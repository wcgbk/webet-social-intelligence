  <style>
:root{--white:#fff;--off:#f8f9fa;--bg:#f2f3f5;--teal:#004C54;--tl:#e6f4f1;--tb:#b8ddd6;--grn:#2e7d32;--gl:#e8f5e9;--gb:#a5d6a7;--olive:#1a2e1a;--bdr:#e0e3e8;--t:#1a2e1a;--tm:#5f6b7a;--tl2:#8b95a3;--red:#c0392b;--sel:rgba(0,76,84,.1);--sb:rgba(0,76,84,.4)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Geist Sans','Inter',system-ui,sans-serif;background:var(--bg);color:var(--t);-webkit-font-smoothing:antialiased;min-height:100vh}

/* Header */
.hdr{background:var(--white);border-bottom:1px solid var(--bdr);padding:.625rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--olive)}
.logo-t{font-size:1rem;font-weight:700}
.hdr-r{display:flex;gap:.5rem;align-items:center}
.hdr-lnk{font-size:.6875rem;font-weight:500;color:var(--tm);text-decoration:none;padding:.25rem .5rem;border-radius:6px;transition:.15s}
.hdr-lnk:hover{background:var(--off);color:var(--olive)}
.bal{font-size:.75rem;font-weight:700;color:var(--grn);background:var(--gl);border:1px solid var(--gb);border-radius:9999px;padding:.25rem .75rem;display:flex;align-items:center;gap:.375rem}
.bal::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--grn)}

/* Layout */
.lay{display:flex;min-height:calc(100vh - 45px)}
.side{width:200px;background:var(--white);border-right:1px solid var(--bdr);padding:1rem 0;overflow-y:auto;flex-shrink:0}
.side-title{font-size:.625rem;font-weight:700;color:var(--tl2);text-transform:uppercase;letter-spacing:.06em;padding:0 1rem .5rem}
.side-item{display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;font-size:.8125rem;font-weight:500;color:var(--tm);cursor:pointer;transition:.12s;border-left:3px solid transparent}
.side-item:hover{background:var(--off);color:var(--olive)}
.side-item.on{background:var(--tl);color:var(--teal);font-weight:600;border-left-color:var(--teal)}
.side-dot{width:8px;height:8px;border-radius:2px}
.side-divider{height:1px;background:var(--bdr);margin:.75rem 1rem}
.main-area{flex:1;overflow-y:auto;padding:0}

/* League tabs */
.ltabs{display:flex;gap:.5rem;padding:1rem 1.5rem .75rem;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--bdr);background:var(--white)}
.ltabs::-webkit-scrollbar{display:none}
.ltab{font-family:inherit;font-size:.75rem;font-weight:600;padding:.375rem .75rem;border-radius:9999px;border:1px solid var(--bdr);background:var(--white);color:var(--tm);cursor:pointer;transition:.15s;white-space:nowrap;display:flex;align-items:center;gap:.375rem}
.ltab:hover{border-color:var(--tb);color:var(--olive)}
.ltab.on{background:var(--teal);color:var(--white);border-color:var(--teal)}
.ltab-icon{width:16px;height:16px;border-radius:50%;background:var(--off);display:inline-flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:700}
.ltab.on .ltab-icon{background:rgba(255,255,255,.2)}

/* Status tabs */
.stabs{display:flex;gap:0;background:var(--white);border-bottom:1px solid var(--bdr)}
.stab{flex:1;text-align:center;padding:.625rem;font-size:.75rem;font-weight:600;color:var(--tm);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.stab:hover{color:var(--olive)}
.stab.on{color:var(--teal);border-bottom-color:var(--teal)}
.stab-cnt{font-size:.625rem;font-weight:700;background:var(--tl);color:var(--teal);border-radius:9999px;padding:.1rem .375rem;margin-left:.25rem}

/* Game grid */
.gg{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;padding:1rem 1.5rem 2rem}

/* Game card */
.gc{background:var(--white);border:1px solid var(--bdr);border-radius:10px;overflow:hidden;transition:box-shadow .15s}
.gc:hover{box-shadow:0 2px 12px rgba(0,0,0,.06)}
.gc-hdr{display:flex;align-items:center;justify-content:space-between;padding:.5rem .75rem;border-bottom:1px solid #f0f1f3}
.gc-time{font-size:.6875rem;font-weight:600;color:var(--tm)}
.gc-view{font-size:.6875rem;font-weight:600;color:var(--teal);cursor:pointer;text-decoration:none}
.gc-view:hover{text-decoration:underline}
.gc-live{font-size:.5625rem;font-weight:700;color:var(--red);display:flex;align-items:center;gap:.25rem}
.gc-live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Column headers */
.gc-colhdr{display:grid;grid-template-columns:1fr 72px 56px 72px;gap:4px;padding:.25rem .75rem 0;align-items:center}
.gc-colhdr span{font-size:.5rem;font-weight:700;color:var(--tl2);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.gc-colhdr span:first-child{text-align:left}

/* Team row */
.gc-body{padding:0 .75rem .5rem}
.trow{display:grid;grid-template-columns:1fr 72px 56px 72px;gap:4px;align-items:center;padding:.375rem 0}
.trow+.trow{border-top:1px solid #f5f5f5}
.tinfo{display:flex;align-items:center;gap:.5rem;min-width:0}
.tlogo{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.4375rem;font-weight:700;color:var(--white);flex-shrink:0;overflow:hidden;border:none}
.tlogo img{width:100%;height:100%;object-fit:contain}
.tname{font-size:.8125rem;font-weight:600;color:var(--olive);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* League color accents */
.gc-stripe{height:3px;width:100%}
.stripe-nba{background:linear-gradient(90deg,#1d428a,#c8102e)}
.stripe-mlb{background:linear-gradient(90deg,#002d72,#d50032)}
.stripe-nhl{background:linear-gradient(90deg,#000,#a2aaad)}
.stripe-mls{background:linear-gradient(90deg,#80004c,#c39e6d)}
.stripe-nfl{background:linear-gradient(90deg,#013369,#d50a0a)}
.stripe-default{background:var(--teal)}

/* Price button */
.pb{font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.25rem .25rem;background:var(--off);border:1px solid var(--bdr);border-radius:6px;cursor:pointer;transition:.12s;text-align:center;width:100%}
.pb:hover{border-color:var(--tb);background:var(--tl)}
.pb.sel{background:var(--sel);border-color:var(--sb)}
.pb-line{font-size:.5625rem;font-weight:600;color:var(--tm);line-height:1.1}
.pb-price{font-size:.6875rem;font-weight:700;color:var(--olive);line-height:1.2}
.pb.sel .pb-line,.pb.sel .pb-price{color:var(--teal)}
.pb[disabled]{opacity:.3;cursor:default}

/* Modal overlay */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;align-items:center;justify-content:center}
.mo.show{display:flex}
.md{background:var(--white);border-radius:16px;width:420px;max-width:calc(100% - 2rem);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}

/* Modal header */
.md-hdr{padding:1rem 1.25rem;border-bottom:1px solid var(--bdr)}
.md-game{font-size:1rem;font-weight:700;color:var(--olive)}
.md-sub{font-size:.6875rem;color:var(--tm)}

/* Order type tabs */
.md-tabs{display:flex;gap:0;border-bottom:1px solid var(--bdr)}
.md-tab{flex:1;text-align:center;padding:.625rem;font-size:.75rem;font-weight:600;color:var(--tm);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.md-tab.on{color:var(--teal);border-bottom-color:var(--teal);background:var(--tl)}

/* Modal body */
.md-body{padding:1rem 1.25rem}
.md-row{display:flex;justify-content:space-between;padding:.375rem 0;font-size:.8125rem}
.md-row-l{color:var(--tm);font-weight:500}
.md-row-v{color:var(--olive);font-weight:700}

.md-inputs{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:1rem 0}
.md-field label{display:block;font-size:.5625rem;font-weight:700;color:var(--tl2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.25rem}
.md-inp{width:100%;font-family:inherit;font-size:1rem;font-weight:700;padding:.625rem .75rem;border:1px solid var(--bdr);border-radius:8px;background:var(--off);color:var(--olive);text-align:right}
.md-inp:focus{outline:none;border-color:var(--teal);background:var(--white)}
.md-avail{font-size:.625rem;font-weight:600;color:var(--grn);margin-top:.25rem}
.md-est{font-size:.625rem;font-weight:600;color:var(--tm);margin-top:.25rem;text-align:right}

/* Quick amounts */
.qamt{display:grid;grid-template-columns:repeat(4,1fr);gap:.375rem;margin-bottom:1rem}
.qa{font-family:inherit;font-size:.6875rem;font-weight:700;padding:.5rem;border:1px solid var(--bdr);border-radius:8px;background:var(--white);color:var(--olive);cursor:pointer;text-align:center;transition:.12s}
.qa:hover{border-color:var(--teal);color:var(--teal)}
.qa.on{background:var(--teal);color:var(--white);border-color:var(--teal)}

/* Challenge section */
.md-challenge{border-top:1px solid var(--bdr);padding-top:.75rem;margin-top:.5rem}
.md-clabel{font-size:.5625rem;font-weight:700;color:var(--tl2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.5rem}
.md-cinp{width:100%;font-family:inherit;font-size:.8125rem;padding:.5rem .625rem;border:1px solid var(--bdr);border-radius:8px;background:var(--off);color:var(--olive);margin-bottom:.5rem}
.md-cinp:focus{outline:none;border-color:var(--teal);background:var(--white)}

/* Modal footer */
.md-foot{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:1rem 1.25rem;border-top:1px solid var(--bdr)}
.btn-c{font-family:inherit;font-size:.875rem;font-weight:600;padding:.75rem;border-radius:10px;cursor:pointer;transition:.15s;border:1px solid var(--bdr);background:var(--white);color:var(--tm)}
.btn-c:hover{background:var(--off)}
.btn-s{font-family:inherit;font-size:.875rem;font-weight:700;padding:.75rem;border-radius:10px;cursor:pointer;transition:.15s;border:none;color:var(--white)}
.btn-review{background:var(--teal)}
.btn-review:hover{background:#003a40}
.btn-submit{background:var(--grn)}
.btn-submit:hover{background:#1b5e20}
.btn-s:disabled{opacity:.4;cursor:not-allowed}

/* Success state */
.success-bar{background:var(--grn);color:var(--white);padding:.75rem 1.25rem;font-size:.8125rem;font-weight:600;display:flex;align-items:center;gap:.5rem}
.success-bar svg{width:20px;height:20px}
.fill-bar{height:6px;background:var(--bdr);border-radius:3px;margin:0 1.25rem;overflow:hidden}
.fill-bar-inner{height:100%;background:var(--grn);border-radius:3px;transition:width .5s}
.fill-info{display:flex;justify-content:space-between;padding:.25rem 1.25rem;font-size:.625rem;color:var(--tm)}

.share-area{text-align:center;padding:1rem 1.25rem}
.share-link{display:flex;align-items:center;gap:.5rem;background:var(--off);border:1px solid var(--bdr);border-radius:8px;padding:.5rem .75rem;margin-bottom:.75rem}
.share-link input{flex:1;font-family:inherit;font-size:.75rem;border:none;background:none;color:var(--olive);font-weight:600}
.share-link button{font-family:inherit;font-size:.625rem;font-weight:600;padding:.3rem .5rem;border:1px solid var(--tb);border-radius:6px;background:var(--tl);color:var(--teal);cursor:pointer}
.share-btns{display:flex;gap:.375rem;justify-content:center}
.share-btn{font-family:inherit;font-size:.6875rem;font-weight:600;padding:.5rem .75rem;border-radius:8px;cursor:pointer;border:1px solid var(--bdr);background:var(--white);color:var(--olive);transition:.12s}
.share-btn:hover{border-color:var(--teal);color:var(--teal)}

/* Loading */
.loading{text-align:center;padding:4rem 1rem}
.spinner{width:28px;height:28px;border:3px solid var(--bdr);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto .75rem}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-txt{font-size:.8125rem;color:var(--tm)}
.err{font-size:.8125rem;color:var(--red);text-align:center;padding:3rem 1rem}
.empty{text-align:center;padding:3rem 1rem;color:var(--tl2);font-size:.875rem}

/* Responsive */
@media(max-width:900px){.gg{grid-template-columns:1fr}}
@media(max-width:768px){
  .side{display:none}
  .gg{padding:1rem .75rem 2rem}
  .ltabs{padding:.75rem .75rem .5rem}
  .gc-colhdr,.trow{grid-template-columns:1fr 64px 48px 64px;gap:3px}
  .pb-line{font-size:.5rem}.pb-price{font-size:.625rem}
  .md{width:100%;max-width:100%;border-radius:12px 12px 0 0;align-self:flex-end}
}
body.embed .hdr{display:none}
body.embed .side{display:none}
  </style>
</head>

function teamInfo(name){
  if(!name)return{c:'#666',logo:''};
  // Try exact match first
  if(TEAMS[name])return TEAMS[name];
  // Try last word match
  const last=name.split(/\s+/).pop();
  if(TEAMS[last])return TEAMS[last];
  // Try partial match
  for(const[k,v]of Object.entries(TEAMS)){
    if(name.toLowerCase().includes(k.toLowerCase())||k.toLowerCase().includes(name.toLowerCase()))return v;
  }
  return{c:'#666',logo:''};
}

function teamLogo(name){
  const t=teamInfo(name);
  if(t.logo)return`<div class="tlogo"><img src="${t.logo}" alt="${abbr(name)}" onerror="this.parentElement.style.background='${t.c}';this.parentElement.textContent='${abbr(name)}'"></div>`;
  return`<div class="tlogo" style="background:${t.c}">${abbr(name)}</div>`;
}

function leagueStripe(lg){
  const k=lg.toLowerCase().replace(/\s.*/,'');
  const cls={'nba':'stripe-nba','mlb':'stripe-mlb','nhl':'stripe-nhl','mls':'stripe-mls','nfl':'stripe-nfl'}[k]||'stripe-default';
  return`<div class="gc-stripe ${cls}"></div>`;
}

/* Group into games */
function group(orders){
  const m={};
  for(const o of orders){
    const k=o.event;
    if(!m[k])m[k]={event:o.event,league:o.league,scheduled:o.scheduled,type:o.type,orders:[],vol:0};
    m[k].orders.push(o);m[k].vol+=(o.openAmt||0);
  }
  return Object.values(m).sort((a,b)=>b.vol-a.vol);
}

/* Clean event name: strip " - 0" scores for non-live */
function cleanEvent(e){return e.replace(/\s*-\s*\d+/g,'').trim()}

function parseTeams(e){
  const clean=cleanEvent(e);
  const p=clean.split(/\s+(?:vs\.?|at|@)\s+/i);
  return p.length===2?{away:p[0].trim(),home:p[1].trim()}:{away:clean,home:''};
}

/* Extract full team names from order titles when event uses abbreviations */
function resolveTeamNames(game){
  const{away,home}=parseTeams(game.event);
  let awayFull=away, homeFull=home;
  // Try to find full names from ML orders
  for(const o of game.orders){
    if(!o.var1||o.var1===0){
      const t=o.title.replace(/\s+to win.*/i,'').replace(/\s+will .*/i,'').trim();
      if(o.side==='away'&&t.length>awayFull.length)awayFull=t;
      if(o.side==='home'&&t.length>homeFull.length)homeFull=t;
    }
  }
  // Also check spread orders for names
  for(const o of game.orders){
    if(o.var1&&o.var1!==0){
      const t=o.title.replace(/\s+[+-][\d.]+$/,'').trim();
      if(o.side==='away'&&t.length>awayFull.length)awayFull=t;
      if(o.side==='home'&&t.length>homeFull.length)homeFull=t;
    }
  }
  return{away:awayFull,home:homeFull};
}

function abbr(n){if(!n)return'?';const w=n.trim().split(/\s+/);return(w.length===1?w[0].substring(0,3):w[w.length-1].substring(0,3)).toUpperCase()}

/* Match orders by side field (away/home/over/under) */
function sideOdds(orders,sideVal,type){
  const m=orders.filter(o=>{
    if(o.side!==sideVal)return false;
    if(type==='ml')return !o.var1||o.var1===0;
    // Spreads: side is away/home AND has var1, AND title contains team name or +/- number
    if(type==='spread')return o.var1&&o.var1!==0;
    return false;
  });
  return m.length?m.sort((a,b)=>(b.openAmt||0)-(a.openAmt||0))[0]:null;
}

/* Find total (over/under) by side field */
function totalOdds(orders,dir){
  const m=orders.filter(o=>o.side===dir&&o.var1&&o.var1!==0);
  return m.length?m.sort((a,b)=>(b.openAmt||0)-(a.openAmt||0))[0]:null;
}

function fmtTime(iso){
  if(!iso)return'Today';
  const d=new Date(iso);
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}

function oddsToPrice(odds){
  if(!odds)return 0;
  if(odds>0)return Math.round(10000/(odds+100))/100;
  return Math.round(Math.abs(odds)*100/(Math.abs(odds)+100))/100;
}

function fmtPrice(odds){return'$'+oddsToPrice(odds).toFixed(2)}
function fmtOdds(o){const n=Math.round(o);return n>=0?'+'+n:''+n}

/* All games come from the full ESPN slate (raw.games), BettorEdge orders overlaid. */
function allGames(){ return (raw && Array.isArray(raw.games)) ? raw.games : []; }
function leagueList(){ return [...new Set(allGames().map(g=>g.league))].filter(Boolean).sort(); }

/* Render game grid — EVERY game on the slate, regardless of exchange liquidity */
function renderGames(){
  let games=allGames();
  if(league!=='all')games=games.filter(g=>g.league===league);
  const live=games.filter(g=>g.state==='in').length;
  // "Upcoming" tab shows every non-finished game (state!=='post'), so the badge must
  // count the same set — otherwise an in-progress game leaks into the view but not the count.
  const upcoming=games.filter(g=>g.state!=='post').length;
  document.getElementById('liveCnt').textContent=String(live);
  document.getElementById('upCnt').textContent=String(upcoming);
  if(status==='live')games=games.filter(g=>g.state==='in');
  else if(status==='upcoming')games=games.filter(g=>g.state!=='post');

  if(!games.length){document.getElementById('gameGrid').innerHTML=`<div class="empty">No games${league!=='all'?' for '+league:''} right now.</div>`;return}
  let html='';for(const g of games)html+=gameCard(g);
  document.getElementById('gameGrid').innerHTML=html;
}

function gameCard(g){
  const away=g.awayTeam||g.awayAbbr||'', home=g.homeTeam||g.homeAbbr||'';
  const matchup=`${away} vs ${home}`;
  const started=g.state==='in'||g.state==='post';
  const ords=g.orders||[];
  const L=g.lines||{};
  function betData(o){return JSON.stringify(o).replace(/'/g,"&#39;");}
  function lockBtn(){return`<button class="pb" disabled><span class="pb-price">🔒</span></button>`;}
  function emptyBtn(){return`<button class="pb" disabled><span class="pb-line">--</span><span class="pb-price">--</span></button>`;}

  // ML / Pick — prefer live BettorEdge order, fall back to Odds API consensus, then even-money pick'em
  function mlBtn(side,team){
    if(started)return lockBtn();
    const be=sideOdds(ords,side,'ml');
    const odds=be?be.odds:(L.ml&&L.ml[side]!=null?L.ml[side]:100);
    const d=betData({event:g.event,league:g.league,sport:g.sport,pick:team+' to win',odds:odds,line:0,matchup:matchup,side:side,market:'ml'});
    return`<button class="pb" onclick='openBet(${d})'><span class="pb-line">${be?'live':'pick'}</span><span class="pb-price">${fmtPrice(odds)}</span></button>`;
  }
  // Spread — BettorEdge order, else Odds API line
  function spreadBtn(side,team){
    if(started)return lockBtn();
    const be=sideOdds(ords,side,'spread');
    let pt=null,odds=null,live=false;
    if(be){pt=be.var1;odds=be.odds;live=true;}
    else if(L.spread){pt=side==='away'?L.spread.awayPt:L.spread.homePt;odds=side==='away'?L.spread.awayOdds:L.spread.homeOdds;}
    if(pt==null||odds==null)return emptyBtn();
    const ln=`${pt>0?'+':''}${pt}`;
    const d=betData({event:g.event,league:g.league,sport:g.sport,pick:team+' '+ln,odds:odds,line:pt,matchup:matchup,side:side,market:'spread'});
    return`<button class="pb" onclick='openBet(${d})'><span class="pb-line">${ln}${live?' •':''}</span><span class="pb-price">${fmtPrice(odds)}</span></button>`;
  }
  // Total — BettorEdge order, else Odds API line
  function totalBtn(dir){
    if(started)return lockBtn();
    const be=totalOdds(ords,dir);
    let pt=null,odds=null,live=false;
    if(be){pt=be.var1;odds=be.odds;live=true;}
    else if(L.total){pt=L.total.point;odds=dir==='over'?L.total.overOdds:L.total.underOdds;}
    if(pt==null||odds==null)return emptyBtn();
    const lbl=(dir==='over'?'Over ':'Under ')+pt;
    const d=betData({event:g.event,league:g.league,sport:g.sport,pick:lbl,odds:odds,line:pt,matchup:matchup,side:dir,market:'total'});
    return`<button class="pb" onclick='openBet(${d})'><span class="pb-line">${dir==='over'?'O':'U'} ${pt}${live?' •':''}</span><span class="pb-price">${fmtPrice(odds)}</span></button>`;
  }

  const timeLabel=started?(g.state==='post'?'Final':'🔒 Live'):fmtTime(g.scheduled);
  return`<div class="gc${started?' gc-started':''}">
    ${leagueStripe(g.league)}
    <div class="gc-hdr"><span class="gc-time">${timeLabel}</span><span class="gc-time">${g.league}</span></div>
    <div class="gc-colhdr"><span></span><span>Spread</span><span>Pick</span><span>Total</span></div>
    <div class="gc-body">
      <div class="trow">
        <div class="tinfo">${teamLogo(away)}<div class="tname">${away}</div></div>
        ${spreadBtn('away',away)}
        ${mlBtn('away',away)}
        ${totalBtn('over')}
      </div>
      <div class="trow">
        <div class="tinfo">${teamLogo(home)}<div class="tname">${home}</div></div>
        ${spreadBtn('home',home)}
        ${mlBtn('home',home)}
        ${totalBtn('under')}
      </div>
    </div>
  </div>`;
}

  mdDeliver=m;

  var on={borderColor:'var(--teal)',background:'var(--tl)',color:'var(--teal)'},off={borderColor:'var(--bdr)',background:'var(--white)',color:'var(--tm)'};
  [[t,m==='sms'?on:off],[d,m==='dm'?on:off]].forEach(function(x){x[0].style.borderColor=x[1].borderColor;x[0].style.background=x[1].background;x[0].style.color=x[1].color;});

}

function calcWin(){
  // Even-money head-to-head: your friend matches your stake, winner takes the pot.
  const qty=parseFloat(document.getElementById('mdQty')?.value)||0;
  const el=document.getElementById('mdWin');
  if(el)el.value=qty.toFixed(2);               // you win their matching stake
  const est=document.getElementById('mdEst');
  if(est)est.textContent=`WINNER TAKES ⓦ${(qty*2).toFixed(0)}`;
}

function setQty(v){
  document.getElementById('mdQty').value=v;

async function submitBet(){
  const b=selectedBet;
  // Must be signed in to wager WeBit
  if(!window.wbaiUser){ window.location.href='/login'; return; }
  if((b._qty||0) > balance){ alert('Not enough WeBit — get a pack at /webit'); return; }

  const deliver=b._deliver||'sms';
  if(deliver==='sms'){ const ph=(b._phone||'').replace(/[^\d+]/g,''); if(ph.replace(/\D/g,'').length<10){ alert('Enter your friend\'s phone, or switch to X DM.'); return; } }

  const btn=document.getElementById('mdSubmitBtn');
  btn.disabled=true;btn.textContent='Staking...';

  try{
    const resp=await fetch('/api/market-bet',{
      method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',
      body:JSON.stringify({
        action:'create',
        sport:b.sport||b.league, league:b.league, event:b.event, matchup:b.matchup||b.event,
        market:b.market||'ml', side:b.side||'', pick:b.pick, odds:b.odds, line:b.line||0,
        stake:Math.round(b._qty||0),
        deliver:deliver==='dm'?'link':'sms',
        friendPhone:deliver==='sms'?b._phone:null
      })
    });
    const data=await resp.json();
    if(data.success){
      refreshWebitAccount();
      selectedBet._betId=data.betId;selectedBet._shareUrl=data.inviteUrl;selectedBet._opp=data.oppositeSide;
      // X DM mode: open the composer prefilled with the invite
      if(deliver==='dm'){
        const stakeN=Math.round(b._qty||0);
        const msg='I bet you: '+b.pick+' ('+(b.matchup||b.event)+') for '+(stakeN>0?'ⓦ '+stakeN+' WeBit':'bragging rights')+'. Take the other side ('+data.oppositeSide+'): '+data.inviteUrl;
        window.open('https://x.com/messages/compose?text='+encodeURIComponent(msg),'_blank');
      }
      modalStep='success';renderModal();
    }else if(data.error==='insufficient_webits'){
      btn.disabled=false;btn.textContent='SUBMIT';
      alert('Not enough WeBit to stake — get a pack at /webit');
    }else{
      btn.disabled=false;btn.textContent='SUBMIT';
      alert('Error: '+(data.error||data.message||'failed'));
    }
  }catch(e){btn.disabled=false;btn.textContent='SUBMIT';alert('Network error: '+e.message)}
}

      <div class="share-btns">
        <button class="share-btn" onclick="window.open('https://x.com/messages/compose?text='+encodeURIComponent('Take the other side of my bet: ${url}'),'_blank')">𝕏 X DM</button>
        <button class="share-btn" onclick="window.open('sms:?body='+encodeURIComponent('Take the other side of my bet: ${url}'))">Text</button>
      </div>
    </div>`:''}
    <div class="md-foot" style="grid-template-columns:1fr">
      <button class="btn-c" onclick="closeModal()">DONE</button>
    </div>`;
}

// ── Invite landing: open a bet by ?bet=ID and let the opponent take the other side ──
async function checkBetInvite(){
  const id=new URLSearchParams(location.search).get('bet');
  if(!id)return;
  const bet=await fetch('/api/market-bet?id='+encodeURIComponent(id)).then(r=>r.ok?r.json():null).catch(()=>null);
  if(!bet||!bet.id)return;
  const banner=document.createElement('div');
  banner.id='betInvite';
  banner.style.cssText='background:linear-gradient(135deg,#004C54,#1a2e1a);color:#fff;padding:1rem 1.25rem;text-align:center;';
  const stakeLbl=bet.stake>0?('ⓦ '+bet.stake+' WeBit'):'bragging rights';
  if(bet.status!=='open'){
    banner.innerHTML='<div style="font-weight:700;">'+(bet.challenger.name||'Someone')+'’s bet</div><div style="font-size:.85rem;opacity:.9;">'+esc2(bet.pick)+' · '+stakeLbl+' · '+(bet.status==='active'?'Already matched':bet.status)+'</div>';
  }else{
    banner.innerHTML='<div style="font-size:1.05rem;font-weight:700;">'+(bet.challenger.name||'Someone')+' bet you!</div>'+
      '<div style="font-size:.9rem;opacity:.95;margin:.25rem 0 .6rem;">They took <b>'+esc2(bet.pick)+'</b> — you take <b>'+esc2(bet.opponent.side)+'</b> for '+stakeLbl+'. Winner takes ⓦ '+(bet.stake*2)+'.</div>'+
      '<button id="takeBetBtn" style="background:#fff;color:#004C54;border:none;border-radius:20px;padding:.5rem 1.1rem;font-weight:800;cursor:pointer;font-family:inherit;">Take the other side</button>'+
      '<div id="takeBetMsg" style="font-size:.8rem;margin-top:.4rem;opacity:.95;"></div>';
  }
  const layEl=document.querySelector('.lay')||document.body;
  layEl.parentNode.insertBefore(banner,layEl);
  const tb=document.getElementById('takeBetBtn');
  if(tb)tb.addEventListener('click',function(){
    const msg=document.getElementById('takeBetMsg');
    if(!window.wbaiUser){ location.href='/login'; return; }
    if(bet.stake>0 && balance<bet.stake){ msg.innerHTML='Need '+bet.stake+' WeBit. <a href="/webit" style="color:#9be8ea;">Get a pack →</a>'; return; }
    tb.disabled=true;tb.textContent='Matching...';
    fetch('/api/market-bet',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'accept',betId:bet.id})})
      .then(r=>r.json()).then(function(j){
        if(j.success){ banner.style.background='linear-gradient(135deg,#2e7d32,#1a2e1a)'; banner.innerHTML='<div style="font-weight:700;">Bet matched — game on!</div><div style="font-size:.85rem;opacity:.9;">Winner takes ⓦ '+(bet.stake*2)+'. Settles after the final.</div>'; refreshWebitAccount(); }
        else if(j.error==='own_bet'){ msg.textContent="That's your own bet."; tb.disabled=false;tb.textContent='Take the other side'; }
        else if(j.error==='insufficient_webits'){ msg.innerHTML='Not enough WeBit. <a href="/webit" style="color:#9be8ea;">Get a pack →</a>'; tb.disabled=false;tb.textContent='Take the other side'; }
        else { msg.textContent='Could not match ('+(j.error||'error')+').'; tb.disabled=false;tb.textContent='Take the other side'; }
      }).catch(function(){ msg.textContent='Network error.'; tb.disabled=false;tb.textContent='Take the other side'; });
  });
}
function esc2(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}

// Lazy-settle the signed-in user's due market bets on load
function settleMyBets(){
  if(!window.wbaiUser)return;
  fetch('/api/market-bet-settle',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({mine:true})})
    .then(r=>r.json()).then(function(j){ if((j&&j.results||[]).some(x=>x.result==='settled'||x.result==='expired_refund'))refreshWebitAccount(); }).catch(function(){});
}

function closeModal(){document.getElementById('modal').classList.remove('show');selectedBet=null;modalStep='form'}
function copyLink(){const el=document.getElementById('shareUrl');el.select();navigator.clipboard.writeText(el.value).then(()=>{el.parentElement.querySelector('button').textContent='Copied!';setTimeout(()=>el.parentElement.querySelector('button').textContent='Copy',2000)})}
function esc(s){return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;')}

init();
</script>
