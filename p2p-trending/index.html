:root{--white:#fff;--off:#f8f9fa;--bg:#f2f3f5;--teal:#004C54;--tl:#e6f4f1;--tb:#b8ddd6;--grn:#2e7d32;--gl:#e8f5e9;--gb:#a5d6a7;--olive:#1a2e1a;--bdr:#e0e3e8;--t:#1a2e1a;--tm:#5f6b7a;--tl2:#8b95a3;--red:#c0392b;--amber:#f39c12;--sel:rgba(0,76,84,.1);--sb:rgba(0,76,84,.4)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
/* Paint the page ground on the root element so mobile browsers
   (esp. Chrome on iOS) never expose the default white canvas in the
   dynamic toolbar / overscroll region. */
html { background: var(--bg); min-height: 100vh; min-height: 100dvh; -webkit-text-size-adjust: 100%; }

body{font-family:'Geist Sans','Inter',system-ui,sans-serif;background:var(--bg);color:var(--t);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}

.hdr{background:var(--white);border-bottom:1px solid var(--bdr);padding:.625rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--olive)}
.logo-t{font-size:1rem;font-weight:700}
.hdr-r{display:flex;gap:.5rem;align-items:center}
.hdr-lnk{font-size:.6875rem;font-weight:500;color:var(--tm);text-decoration:none;padding:.25rem .5rem;border-radius:6px;transition:.15s}
.hdr-lnk:hover{background:var(--off);color:var(--olive)}
.bal{font-size:.75rem;font-weight:700;color:var(--grn);background:var(--gl);border:1px solid var(--gb);border-radius:9999px;padding:.25rem .75rem;display:flex;align-items:center;gap:.375rem}
.bal::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--grn)}

.lay{display:flex;min-height:calc(100vh - 45px)}
.side{width:200px;background:var(--white);border-right:1px solid var(--bdr);padding:1rem 0;overflow-y:auto;flex-shrink:0}
.side-title{font-size:.625rem;font-weight:700;color:var(--tl2);text-transform:uppercase;letter-spacing:.06em;padding:0 1rem .5rem}
.side-item{display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;font-size:.8125rem;font-weight:500;color:var(--tm);cursor:pointer;transition:.12s;border-left:3px solid transparent}
.side-item:hover{background:var(--off);color:var(--olive)}
.side-item.on{background:var(--tl);color:var(--teal);font-weight:600;border-left-color:var(--teal)}
.side-divider{height:1px;background:var(--bdr);margin:.75rem 1rem}

.main-area{flex:1;overflow-y:auto}

.ltabs{display:flex;gap:.5rem;padding:1rem 1.5rem .75rem;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--bdr);background:var(--white)}
.ltabs::-webkit-scrollbar{display:none}
.ltab{font-family:inherit;font-size:.75rem;font-weight:600;padding:.375rem .75rem;border-radius:9999px;border:1px solid var(--bdr);background:var(--white);color:var(--tm);cursor:pointer;transition:.15s;white-space:nowrap}
.ltab:hover{border-color:var(--tb);color:var(--olive)}
.ltab.on{background:var(--teal);color:var(--white);border-color:var(--teal)}

.stabs{display:flex;gap:0;background:var(--white);border-bottom:1px solid var(--bdr)}
.stab{flex:1;text-align:center;padding:.625rem;font-size:.75rem;font-weight:600;color:var(--tm);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.stab:hover{color:var(--olive)}
.stab.on{color:var(--teal);border-bottom-color:var(--teal)}
.stab-cnt{font-size:.625rem;font-weight:700;background:var(--tl);color:var(--teal);border-radius:9999px;padding:.1rem .375rem;margin-left:.25rem}

/* Topic cards grid — matches p2p-sports */
.gg{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;padding:1rem 1.5rem 2rem}

/* Topic card — compact, matching sports card height */
.tc{background:var(--white);border:1px solid var(--bdr);border-radius:10px;overflow:hidden;transition:box-shadow .15s}
.tc:hover{box-shadow:0 2px 12px rgba(0,0,0,.06)}

/* Category color stripe */
.tc-stripe{height:3px;width:100%}
.stripe-politics{background:linear-gradient(90deg,#4338ca,#7c3aed)}
.stripe-culture{background:linear-gradient(90deg,#be185d,#ec4899)}
.stripe-technology{background:linear-gradient(90deg,#047857,#10b981)}
.stripe-sports{background:linear-gradient(90deg,#004C54,#00838f)}
.stripe-prediction-markets{background:linear-gradient(90deg,#0369a1,#38bdf8)}
.stripe-social-intelligence{background:linear-gradient(90deg,#92400e,#f59e0b)}

.tc-hdr{display:flex;align-items:center;justify-content:space-between;padding:.5rem .75rem;border-bottom:1px solid #f0f1f3}
.tc-hdr-left{display:flex;align-items:center;gap:.375rem}
.tc-cat{font-size:.5rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:4px;padding:.125rem .35rem}
.cat-politics{background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe}
.cat-culture{background:#fdf2f8;color:#be185d;border:1px solid #fbcfe8}
.cat-technology{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.cat-sports{background:var(--tl);color:var(--teal);border:1px solid var(--tb)}
.cat-prediction-markets{background:#e0f2fe;color:#0369a1;border:1px solid #7dd3fc}
.cat-social-intelligence{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.tc-score{font-size:.5625rem;font-weight:700;color:#d97706;background:#fef3c7;border:1px solid #fde68a;border-radius:4px;padding:.1rem .35rem;display:flex;align-items:center;gap:.2rem}
.tc-hdr-right{display:flex;align-items:center;gap:.5rem}
.tc-deadline{font-size:.5625rem;font-weight:600;color:var(--tl2)}
.tc-view{font-size:.5625rem;font-weight:600;color:var(--teal);cursor:pointer;background:none;border:none;font-family:inherit}
.tc-view:hover{text-decoration:underline}

/* Card body — compact like sports cards */
.tc-body{padding:.5rem .75rem .625rem}

/* Topic title row — like team name row */
.tc-row{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center;padding:.25rem 0}
.tc-row+.tc-row{border-top:1px solid #f5f5f5}
.tc-topic{display:flex;align-items:center;gap:.5rem;min-width:0}
.tc-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid var(--bdr);flex-shrink:0;overflow:hidden}
.tc-icon svg{width:14px;height:12px}
.tc-title{font-size:.75rem;font-weight:600;color:var(--olive);white-space:normal;line-height:1.3}
.tc-summary{font-size:.625rem;color:var(--tm);line-height:1.4;margin-top:.25rem}
.tc-readmore{font-size:.625rem;font-weight:600;color:var(--teal);cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.tc-readmore:hover{text-decoration:underline}

/* WeBet price button — like the sports price buttons */
.tc-bet{font-family:inherit;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:140px;padding:.375rem .625rem;background:var(--off);border:1px solid var(--bdr);border-left:3px solid var(--teal);border-radius:6px;cursor:pointer;transition:.12s;text-align:left}
.tc-bet:hover{border-color:var(--tb);background:var(--tl)}
.tc-bet-label{font-size:.5rem;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.04em}
.tc-bet-text{font-size:.625rem;font-weight:600;color:var(--olive);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Wager + action row at bottom */
.tc-actions{display:flex;gap:.25rem;align-items:center;padding:.375rem 0 0;border-top:1px solid #f0f1f3;margin-top:.25rem}
.wc{font-family:inherit;font-size:.5625rem;font-weight:700;padding:.25rem .375rem;border:1px solid var(--bdr);border-radius:4px;background:var(--white);color:var(--olive);cursor:pointer;transition:.12s;text-align:center}
.wc:hover{border-color:var(--teal);color:var(--teal)}
.wc.on{background:var(--teal);color:var(--white);border-color:var(--teal)}
.tc-send{font-family:inherit;display:flex;align-items:center;gap:.375rem;padding:.375rem .75rem;border-radius:6px;font-size:.625rem;font-weight:700;cursor:pointer;transition:.12s;border:none;background:var(--teal);color:var(--white);margin-left:auto;white-space:nowrap}
.tc-send:hover{background:#003a40}
.tc-send svg{width:12px;height:12px}

/* Logo in card */
.tc-logo-wrap{width:22px;height:22px;border-radius:6px;border:1px solid var(--bdr);background:var(--white);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.tc-logo-wrap svg{width:14px;height:13px}

/* Article popup overlay */
.article-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;align-items:center;justify-content:center;padding:1rem}
.article-overlay.show{display:flex}
.article-frame{background:var(--white);border-radius:16px;width:680px;max-width:100%;height:85vh;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.2);display:flex;flex-direction:column;position:relative}
.af-close{position:absolute;top:.5rem;right:.5rem;z-index:5;width:32px;height:32px;border-radius:50%;background:var(--white);border:1px solid var(--bdr);color:var(--tl2);cursor:pointer;font-size:1.125rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.af-close:hover{color:var(--olive);background:var(--off)}
.af-body{flex:1;overflow-y:auto;padding:0}
.af-body iframe{width:100%;height:100%;border:none}
@media(max-width:768px){
  .article-overlay{padding:0}
  .article-frame{width:100%;height:100%;max-width:100%;border-radius:0}
  .af-close{top:.75rem;right:.75rem}
}

/* Bet modal — identical to /p2p-sports */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;align-items:center;justify-content:center}
.mo.show{display:flex}
.md{background:var(--white);border-radius:16px;width:440px;max-width:calc(100% - 2rem);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.md-hdr{padding:1rem 1.25rem;border-bottom:1px solid var(--bdr)}
.md-game{font-size:1rem;font-weight:700;color:var(--olive);line-height:1.3}
.md-sub{font-size:.6875rem;color:var(--tm);margin-top:.125rem}
.md-tabs{display:flex;gap:0;border-bottom:1px solid var(--bdr)}
.md-tab{flex:1;text-align:center;padding:.625rem;font-size:.75rem;font-weight:600;color:var(--tm);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.md-tab.on{color:var(--teal);border-bottom-color:var(--teal);background:var(--tl)}
.md-body{padding:1rem 1.25rem}
.md-row{display:flex;justify-content:space-between;padding:.375rem 0;font-size:.8125rem}
.md-row-l{color:var(--tm);font-weight:500}
.md-row-v{color:var(--olive);font-weight:700;text-align:right;max-width:60%}
.md-inputs{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:1rem 0}
.md-field label{display:block;font-size:.5625rem;font-weight:700;color:var(--tl2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.25rem}
.md-inp{width:100%;font-family:inherit;font-size:1rem;font-weight:700;padding:.625rem .75rem;border:1px solid var(--bdr);border-radius:8px;background:var(--off);color:var(--olive);text-align:right}
.md-inp:focus{outline:none;border-color:var(--teal);background:var(--white)}
.md-avail{font-size:.625rem;font-weight:600;color:var(--grn);margin-top:.25rem}
.md-est{font-size:.625rem;font-weight:600;color:var(--tm);margin-top:.25rem;text-align:right}
.qamt{display:grid;grid-template-columns:repeat(4,1fr);gap:.375rem;margin-bottom:1rem}
.qa{font-family:inherit;font-size:.6875rem;font-weight:700;padding:.5rem;border:1px solid var(--bdr);border-radius:8px;background:var(--white);color:var(--olive);cursor:pointer;text-align:center;transition:.12s}
.qa:hover{border-color:var(--teal);color:var(--teal)}
.qa.on{background:var(--teal);color:var(--white);border-color:var(--teal)}
.md-challenge{border-top:1px solid var(--bdr);padding-top:.75rem;margin-top:.5rem}
.md-clabel{font-size:.5625rem;font-weight:700;color:var(--tl2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.5rem}
.md-cinp{width:100%;font-family:inherit;font-size:.8125rem;padding:.5rem .625rem;border-radius:8px;border:1px solid var(--bdr);background:var(--off);color:var(--olive);margin-bottom:.5rem}

.md-foot{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:1rem 1.25rem;border-top:1px solid var(--bdr)}
.btn-c{font-family:inherit;font-size:.875rem;font-weight:600;padding:.75rem;border-radius:10px;cursor:pointer;transition:.15s;border:1px solid var(--bdr);background:var(--white);color:var(--tm)}
.btn-c:hover{background:var(--off)}
.btn-s{font-family:inherit;font-size:.875rem;font-weight:700;padding:.75rem;border-radius:10px;cursor:pointer;transition:.15s;border:none;color:var(--white)}
.btn-review{background:var(--teal)}.btn-review:hover{background:#003a40}
.btn-submit{background:var(--grn)}.btn-submit:hover{background:#1b5e20}
.btn-s:disabled{opacity:.4;cursor:not-allowed}

.success-bar{background:var(--grn);color:var(--white);padding:.75rem 1.25rem;font-size:.8125rem;font-weight:600;display:flex;align-items:center;gap:.5rem}
.fill-bar{height:6px;background:var(--bdr);border-radius:3px;margin:0 1.25rem;overflow:hidden}
.fill-bar-inner{height:100%;background:var(--grn);border-radius:3px;width:100%}
.fill-info{display:flex;justify-content:space-between;padding:.25rem 1.25rem;font-size:.625rem;color:var(--tm)}
.share-area{text-align:center;padding:1rem 1.25rem}
.share-link{display:flex;align-items:center;gap:.5rem;background:var(--off);border:1px solid var(--bdr);border-radius:8px;padding:.5rem .75rem;margin-bottom:.75rem}
.share-link input{flex:1;font-family:inherit;font-size:.75rem;border:none;background:none;color:var(--olive);font-weight:600}
.share-link button{font-family:inherit;font-size:.625rem;font-weight:600;padding:.3rem .5rem;border:1px solid var(--tb);border-radius:6px;background:var(--tl);color:var(--teal);cursor:pointer}
.share-btns{display:flex;gap:.375rem;justify-content:center}
.share-btn{font-family:inherit;font-size:.6875rem;font-weight:600;padding:.5rem .75rem;border-radius:8px;cursor:pointer;border:1px solid var(--bdr);background:var(--white);color:var(--olive);transition:.12s}
.share-btn:hover{border-color:var(--teal);color:var(--teal)}

.loading{text-align:center;padding:4rem 1rem}
.spinner{width:28px;height:28px;border:3px solid var(--bdr);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto .75rem}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-txt{font-size:.8125rem;color:var(--tm)}
.err{font-size:.8125rem;color:var(--red);text-align:center;padding:3rem 1rem}
.empty{text-align:center;padding:3rem 1rem;color:var(--tl2);font-size:.875rem}

@media(max-width:900px){.gg{grid-template-columns:1fr}}
@media(max-width:768px){
  .side{display:none}
  .gg{padding:1rem .75rem 2rem}
  .ltabs{padding:.75rem .75rem .5rem}
  .tc-img{height:120px}
  .md{width:100%;max-width:100%;border-radius:12px 12px 0 0;align-self:flex-end}
}
body.embed .hdr{display:none}
body.embed .side{display:none}
  </style>

/* Generate attention-grabbing headlines from pipeline articles */
function makeHeadline(p){
  const blog=p.blog||{};
  const title=blog.title||p.topic||'';
  const claim=(p.claim||'').toLowerCase();
  /* If it's a question, punch it up */
  if(title.includes('?'))return title;
  /* If it has a strong verb, keep it but add urgency */
  if(title.length>60)return title;
  return title;
}

/* Generate 2-3 line summary from pipeline article data */
function makeSummary(p){
  const blog=p.blog||{};
  if(blog.summary)return blog.summary;
  if(p.claim){
    const agents=p.agents||{};
    const verdicts=[];
    for(const k of['grok','claude','chatgpt']){
      if(agents[k]&&agents[k].verdict)verdicts.push(k.charAt(0).toUpperCase()+k.slice(1)+' says '+agents[k].verdict);
    }
    return(p.claim+(verdicts.length?' '+verdicts.join('. ')+'.':''));
  }
  return'';
}

function betData(p,side){
  const blog=p.blog||{};
  const agents=p.agents||{};
  const yp=agentYesPrice(agents);
  const price=side==='YES'?yp:(1-yp);
  const odds=priceToOdds(price);
  const d={
    event:blog.title||p.topic,
    league:cap(p.category||'trending'),
    pick:side==='YES'?'Yes — '+shortClaim(p.claim):'No — '+shortClaim(p.claim),
    odds:odds,
    line:0,
    matchup:blog.title||p.topic,
    betId:p.betId,
    betUrl:p.betUrl,
    deadline:p.deadline
  };
  return JSON.stringify(d).replace(/'/g,"&#39;");
}

/* Derive implied probability from agent consensus */
function agentYesPrice(agents){
  let scores=[];
  for(const k of ['grok','claude','chatgpt']){
    const a=agents[k];
    if(!a)continue;
    const v=(a.verdict||'').toLowerCase();
    const c=a.confidence||'medium';
    let base=0.5;
    if(v.includes('likely')||v.includes('probable'))base=0.65;
    if(v.includes('unlikely')||v.includes('improbable'))base=0.35;
    if(v.includes('highly likely')||v.includes('very likely'))base=0.8;
    if(v.includes('highly unlikely'))base=0.2;
    if(c==='high')base=base>0.5?Math.min(base+0.1,0.9):Math.max(base-0.1,0.1);
    scores.push(base);
  }
  if(!scores.length)return 0.50;
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*100)/100;
}

function priceToOdds(price){
  if(price<=0||price>=1)return 100;
  if(price>=0.5)return Math.round(-100*price/(1-price));
  return Math.round(100*(1-price)/price);
}

function shortClaim(c){
  if(!c)return'';
  return c.length>60?c.substring(0,57)+'...':c;
}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):''}
function esc(s){return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;')}
function stripHtml(h){return h?h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim():''}

/* Build grammatical bet string from claim */
function buildBetString(claim,deadline){
  if(!claim)return'';
  // Strip "Will " prefix and "?" suffix, clean up for bet format
  let s=claim.replace(/^\s*will\s+/i,'').replace(/\?\s*$/,'').trim();
  // Capitalize first letter
  s=s.charAt(0).toUpperCase()+s.slice(1);
  // Format deadline
  let dl='';
  if(deadline){
    const parts=deadline.split('/');
    if(parts.length>=2){
      const months=['','January','February','March','April','May','June','July','August','September','October','November','December'];
      const m=parseInt(parts[0]);const d=parseInt(parts[1]);const y=parts[2]||'26';
      const fmtDate=`${months[m]||parts[0]} ${d}, 20${y.length===2?y:y}`;
      // Avoid redundancy: skip deadline if claim already contains year/date info
      if(!s.toLowerCase().includes(String(20+(y.length===2?y:y)).slice(-4))){
        dl=` by ${fmtDate}`;
      }
    }else{
      if(!s.toLowerCase().includes(deadline.toLowerCase()))dl=' by '+deadline;
    }
  }
  // Clean up double periods
  return(s+dl).replace(/\.+$/,'').trim()+'.';
}

}

function calcWin(){
  const qty=parseFloat(document.getElementById('mdQty')?.value)||0;
  const el=document.getElementById('mdWin');if(el)el.value=qty.toFixed(2);   // even-money: you win their matching stake
  const est=document.getElementById('mdEst');if(est)est.textContent='WINNER TAKES ⓦ'+(qty*2).toFixed(0);
}

function setQty(v){
  document.getElementById('mdQty').value=v;
  document.querySelectorAll('.qa').forEach(q=>q.classList.toggle('on',parseFloat(q.textContent.split('\n').pop())===v));
  calcWin();
}

function renderReview(){
  const b=selectedBet;
  const qty=parseFloat(document.getElementById('mdQty')?.value)||10;
  const odds=b.odds;
  let win=0;if(odds>=0)win=qty*(odds/100);else win=qty*(100/Math.abs(odds));
  const phone=document.getElementById('mdPhone')?.value||'';
  selectedBet._qty=qty;selectedBet._win=qty;selectedBet._deliver=mbDeliver;selectedBet._phone=phone;

  const price=Math.abs(odds)>=100?(odds>0?Math.round(10000/(odds+100))/100:Math.round(Math.abs(odds)*100/(Math.abs(odds)+100))/100):0.5;

  document.getElementById('mdContent').innerHTML=`
    <div class="md-hdr"><div class="md-game">${b.matchup||b.event}</div><div class="md-sub">Confirm your order</div></div>
    <div class="md-body">
      <div class="md-row"><span class="md-row-l">Outcome</span><span class="md-row-v">${b.pick}</span></div>
      <div class="md-row"><span class="md-row-l">Odds</span><span class="md-row-v">${fmtOdds(odds)} (${(price*100).toFixed(0)}%)</span></div>
      <div class="md-row"><span class="md-row-l">Quantity</span><span class="md-row-v">ⓦ${qty.toFixed(2)}</span></div>
      <div class="md-row"><span class="md-row-l">Potential Winnings</span><span class="md-row-v" style="color:var(--grn)">ⓦ${(qty+win).toFixed(2)}</span></div>
      ${opp?`<div class="md-row"><span class="md-row-l">Challenge</span><span class="md-row-v">${opp}</span></div>`:''}
    </div>
    <div class="md-foot">
      <button class="btn-c" onclick="modalStep='form';renderModal()">Back</button>
      <button class="btn-s btn-submit" id="mdSubmitBtn" onclick="submitBet()">SUBMIT</button>
    </div>`;
}

async function submitBet(){
  const b=selectedBet;
  if(!window.wbaiUser){window.location.href='/login';return;}
  if((b._qty||0)>balance){alert('Not enough WeBit — get a pack at /webit');return;}
  const deliver=b._deliver||'dm';
  if(deliver==='sms'){const ph=(b._phone||'').replace(/\D/g,'');if(ph.length<10){alert('Enter your friend\'s phone, or switch to X DM.');return;}}
  // Yes/No side from the pick text ("Yes — ..." / "No — ...")
  const side=/^no\b/i.test(b.pick)?'no':'yes';

  const btn=document.getElementById('mdSubmitBtn');
  btn.disabled=true;btn.textContent='Staking...';
  try{
    const resp=await fetch('/api/market-bet',{
      method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',
      body:JSON.stringify({
        action:'create', market:'prediction', sport:'Prediction',
        event:b.event, league:b.league||'Prediction', matchup:b.matchup||b.event,
        pick:b.pick, side:side, odds:b.odds||100, line:0,
        stake:Math.round(b._qty||0),
        deliver:deliver==='dm'?'link':'sms', friendPhone:deliver==='sms'?b._phone:null
      })
    });
    const data=await resp.json();
    if(data.success){
      refreshWebitAccount();
      selectedBet._betId=data.betId;selectedBet._shareUrl=data.inviteUrl;selectedBet._opp=data.oppositeSide;
      if(deliver==='dm'){
        const stakeN=Math.round(b._qty||0);
        const msg='I bet you: '+b.pick+' for '+(stakeN>0?'ⓦ '+stakeN+' WeBit':'bragging rights')+'. Take the other side ('+(data.oppositeSide||'')+'): '+data.inviteUrl;
        window.open('https://x.com/messages/compose?text='+encodeURIComponent(msg),'_blank');
      }
      modalStep='success';renderModal();
    }else if(data.error==='insufficient_webits'){btn.disabled=false;btn.textContent='SUBMIT';alert('Not enough WeBit — get a pack at /webit');}
    else{btn.disabled=false;btn.textContent='SUBMIT';alert('Error: '+(data.error||data.message||'failed'))}
  }catch(e){btn.disabled=false;btn.textContent='SUBMIT';alert('Network error: '+e.message)}
}

function renderSuccess(){
  const b=selectedBet;const qty=b._qty||10;const odds=b.odds;
  let win=0;if(odds>=0)win=qty*(odds/100);else win=qty*(100/Math.abs(odds));
  const price=Math.abs(odds)>=100?(odds>0?Math.round(10000/(odds+100))/100:Math.round(Math.abs(odds)*100/(Math.abs(odds)+100))/100):0.5;
  const url=b._shareUrl||'';
  document.getElementById('mdContent').innerHTML=`
    <div class="success-bar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20"><path d="M20 6L9 17l-5-5"/></svg>Order Created Successfully</div>
    <div style="padding:.75rem 1.25rem;font-size:1.125rem;font-weight:700;color:var(--olive);text-align:center">ORDER PLACED</div>
    <div class="fill-bar"><div class="fill-bar-inner"></div></div>
    <div class="fill-info"><span>Placed: ⓦ${qty.toFixed(2)}</span><span>Order: ⓦ${qty.toFixed(2)}</span></div>
    <div class="md-body">
      <div class="md-row"><span class="md-row-l">Outcome</span><span class="md-row-v">${b.pick}</span></div>
      <div class="md-row"><span class="md-row-l">Amount</span><span class="md-row-v">ⓦ${qty.toFixed(2)}</span></div>
      <div class="md-row"><span class="md-row-l">Price</span><span class="md-row-v">${(price*100).toFixed(1)}% (${fmtOdds(odds)})</span></div>
      <div class="md-row"><span class="md-row-l">Potential Winnings</span><span class="md-row-v" style="color:var(--grn)">ⓦ${(qty+win).toFixed(2)}</span></div>
    </div>
    ${url?`<div class="share-area"><div class="share-link"><input id="shareUrl" value="${url}" readonly onclick="this.select()"><button onclick="copyLink()">Copy</button></div>
    <div class="share-btns"><button class="share-btn" onclick="window.open('sms:?body='+encodeURIComponent('I challenged you! ${url}'))">Text</button><button class="share-btn" onclick="window.open('https://x.com/intent/tweet?text='+encodeURIComponent('P2P bet on WeBetAI! ${url}'))">Post on X</button></div></div>`:''}
    <div class="md-foot" style="grid-template-columns:1fr 1fr">
      <button class="btn-c" onclick="closeModal()">CLOSE</button>
      <button class="btn-s btn-review" onclick="if(selectedBet._shareUrl)window.open(selectedBet._shareUrl,'_blank')">SHARE</button>
    </div>`;
}

function closeModal(){document.getElementById('modal').classList.remove('show');selectedBet=null;modalStep='form'}
function copyLink(){const el=document.getElementById('shareUrl');el.select();navigator.clipboard.writeText(el.value).then(()=>{el.parentElement.querySelector('button').textContent='Copied!';setTimeout(()=>el.parentElement.querySelector('button').textContent='Copy',2000)})}
function fmtOdds(o){const n=Math.round(o);return n>=0?'+'+n:''+n}

init();
</script>
</body>
</html>
