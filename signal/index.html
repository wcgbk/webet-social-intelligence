<!DOCTYPE html>

<head>

<title>The Signal — by Ben Klein</title>

<meta property="og:title" content="The Signal — by Ben Klein" />
<meta property="og:description" content="Signal over noise. Daily, by @wcgbk." />
<meta property="og:type" content="website" />

<style>
  :root{ --teal:#15403d; --teal-ink:#143b38; --gold:#bf9a45; --bg:#f7f4ec; --bg2:#eef0ea; --mute:#5f6f6a; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--teal-ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center}
  .card{max-width:600px;margin:24px;background:#fbf9f3;border:1px solid rgba(21,64,61,.12);border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(21,64,61,.10)}
  .band{background:var(--teal);padding:18px 0;border-bottom:4px solid var(--gold)}
  .band b{color:#f4f1e6;letter-spacing:7px;font-size:18px}
  .wrap{padding:40px 40px 44px}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:34px;line-height:1.2;margin:0 0 8px;color:var(--teal-ink)}
  .by{color:var(--gold);font-weight:700;letter-spacing:1px;font-size:14px;margin-bottom:22px}
  p{color:#46524e}
  a.btn{display:inline-block;margin-top:24px;color:#f4f1e6;background:var(--teal);text-decoration:none;font-weight:700;padding:12px 24px;border-radius:10px}
  a.btn:hover{background:#10322f}
  a.x{color:var(--gold);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div class="band"><b>THE SIGNAL</b></div>
  <div class="wrap">
    <h1>Signal over noise.</h1>
    <div class="by">BY BEN KLEIN · <a class="x" href="https://x.com/wcgbk">@wcgbk</a></div>
    <p>Daily takes, lessons, and threads on startups, venture, markets, crypto, and the AI era — for founders who want to see clearly.</p>
    <a class="btn" href="https://x.com/wcgbk">Follow on X →</a>
  </div>
</div>
</body>
</html>
