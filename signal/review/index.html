<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>The Signal — Review Queue</title>
<style>
  :root{ --bg:#06080f; --card:#0e1322; --bd:rgba(255,255,255,.09); --tx:#e8ecf5; --mut:#8b94a8; --gold:#e9b949; --grn:#5fd08a; --red:#ef6a6a; --yel:#e9b949; }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:22px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:18px;margin:0;letter-spacing:3px} .by{color:var(--mut);font-size:12px;letter-spacing:1px}
  .rail{width:4px;height:26px;background:var(--gold);border-radius:2px}
  main{max-width:860px;margin:0 auto;padding:24px}
  .keybar{display:flex;gap:8px;margin-bottom:20px}
  input,textarea{background:#11172a;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:9px 11px;font:inherit;width:100%}
  textarea{min-height:84px;resize:vertical}
  button{background:#1a2236;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
  button:hover{border-color:var(--gold)}
  .btn-go{background:var(--grn);color:#04140a;border:none} .btn-no{background:transparent;color:var(--red);border-color:rgba(239,106,106,.4)}
  .btn-go:hover{filter:brightness(1.08)}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:18px}
  .meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;letter-spacing:1.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--bd)}
  .slot{color:var(--gold);font-weight:700;text-transform:capitalize}
  .risk-low{color:var(--grn);border-color:rgba(95,208,138,.4)} .risk-sensitive{color:var(--yel);border-color:rgba(233,185,73,.5)}
  .tw{white-space:pre-wrap;background:#0a0f1c;border:1px solid var(--bd);border-radius:8px;padding:11px 13px;margin:8px 0}
  .actions{display:flex;gap:8px;margin-top:12px}
  img.preview{width:100%;border-radius:10px;border:1px solid var(--bd);margin:8px 0}
  .muted{color:var(--mut)} .empty{color:var(--mut);text-align:center;padding:40px}
  .sec{font-size:13px;letter-spacing:2px;color:var(--mut);margin:28px 0 10px;text-transform:uppercase}
  .recent{opacity:.7;font-size:14px;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
</style>
</head>
<body>
<header>
  <span class="rail"></span>
  <div><h1>THE SIGNAL</h1><div class="by">REVIEW QUEUE · @wcgbk</div></div>
  <div style="flex:1"></div>
  <span id="who" class="muted" style="font-size:13px"></span>
</header>
<main>
  <div class="keybar">
    <input id="key" type="password" placeholder="REVIEW_KEY" />
    <button onclick="saveKey()">Load</button>
  </div>
  <div class="sec">Pending approval</div>
  <div id="pending"><div class="empty">Enter your key and load.</div></div>
  <div class="sec">Recent</div>
  <div id="recent"></div>
</main>
<script>
const $ = (s)=>document.querySelector(s);
let KEY = localStorage.getItem("signal_key") || "";
if(KEY) $("#key").value = KEY;

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function saveKey(){ KEY = $("#key").value.trim(); localStorage.setItem("signal_key", KEY); load(); }

async function api(method, body){
  const url = "/api/review?key=" + encodeURIComponent(KEY) + (method==="GET"&&body?("&"+body):"");
  const opt = { method, headers:{} };
  if(method==="POST"){ opt.headers["Content-Type"]="application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt);
  return r.json();
}

function tweetsHtml(d){
  if(d.kind==="thread" && Array.isArray(d.tweets))
    return d.tweets.map((t,i)=>`<div class="tw">${i===0?"<b>🧵 ":"<b>"+(i)+"/ </b>"}${esc(t)}${i===0?"</b>":""}</div>`).join("");
  return `<div class="tw">${esc(d.text||"")}</div>`;
}

function cardHtml(d){
  const risk = d.risk==="sensitive"?"risk-sensitive":"risk-low";
  const img = d.image ? `<img class="preview" src="data:image/png;base64,${d.image}" />` : "";
  return `<div class="card" id="c_${esc(d.id)}">
    <div class="meta">
      <span class="badge slot">${esc(d.slot)}</span>
      <span class="badge">${esc((d.niche||"").toUpperCase())}</span>
      <span class="badge ${risk}">${esc((d.risk||"").toUpperCase())}</span>
      <span class="muted" style="font-size:12px">${esc(d.date||"")}</span>
    </div>
    ${tweetsHtml(d)}
    ${img}
    <div class="actions">
      <button class="btn-go" onclick="act('${esc(d.id)}','approve',this)">✓ Approve &amp; post</button>
      <button class="btn-no" onclick="act('${esc(d.id)}','reject',this)">✕ Reject</button>
    </div>
  </div>`;
}

async function act(id, action, btn){
  if(action==="approve" && !confirm("Post this to @wcgbk now?")) return;
  btn.disabled=true; btn.textContent = action==="approve"?"Posting…":"Rejecting…";
  const res = await api("POST", { action, id });
  if(res.ok || res.posted){ const el=$("#c_"+CSS.escape(id)); if(el) el.remove(); }
  else { alert("Error: "+(res.error||"unknown")); btn.disabled=false; btn.textContent = action==="approve"?"✓ Approve & post":"✕ Reject"; }
}

async function load(){
  if(!KEY){ return; }
  $("#pending").innerHTML = '<div class="empty">Loading…</div>';
  try{
    const who = await api("GET","whoami=1");
    if(who.handle) $("#who").textContent = "posting as "+who.handle+(who.isWcgbk?" ✓":" ⚠ NOT @wcgbk");
  }catch(e){}
  const data = await api("GET");
  if(data.error){ $("#pending").innerHTML = `<div class="empty">${esc(data.error)}</div>`; return; }
  $("#pending").innerHTML = (data.pending&&data.pending.length)
    ? data.pending.map(cardHtml).join("")
    : '<div class="empty">Nothing pending. 🎉</div>';
  $("#recent").innerHTML = (data.recent||[]).map(d=>`<div class="recent">
      <span class="badge slot">${esc(d.slot)}</span>
      <span class="muted">${esc(d.status)}</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((d.text||(d.tweets&&d.tweets[0])||"").slice(0,90))}</span>
    </div>`).join("");
}
load();
</script>
</body>
</html>
